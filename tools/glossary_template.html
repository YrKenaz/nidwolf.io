<title>위스키 용어 사전 — 라벨과 티어표에 나오는 낱말 풀이</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
/* 색 토큰은 build.py 가 tools/template.html 에서 그대로 가져온다(모든 페이지 공통) */
__TOKENS__

*{box-sizing:border-box}
html{scroll-padding-top:16px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* 사이트 메뉴: 티어표·칵테일 페이지와 같은 모양 */
.site{display:flex;flex-wrap:wrap;gap:4px 22px;border-bottom:1px solid var(--line);margin:0 0 22px;font-size:14.5px}
.site a{color:var(--muted);text-decoration:none;padding:6px 0 9px;border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:500}
.site a:hover{color:var(--ink)}
.site a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
h1{font-family:var(--display);font-weight:900;font-size:clamp(28px,5vw,44px);line-height:1.15;margin:0;letter-spacing:-.01em;word-break:keep-all}
.lede{color:var(--muted);margin:10px 0 0;max-width:62ch;word-break:keep-all}
a{color:var(--accent)}
.toc{list-style:none;margin:24px 0 8px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.toc li{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.toc .tg{font-size:12.5px;color:var(--muted);min-width:96px;font-weight:700}
.toc a{font-size:14px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.toc a:hover{color:var(--accent);border-color:var(--accent)}
.gsec{margin-top:36px}
.gsec>h2{font-family:var(--display);font-size:22px;margin:0 0 4px}
.term{padding:18px 0;border-top:1px solid var(--line)}
.term h3{font-size:19px;margin:0;word-break:keep-all}
.term h3 small{font-size:13.5px;font-weight:400;color:var(--muted);margin-left:4px}
.term .short{margin:6px 0 0;font-weight:500;word-break:keep-all}
.term .body{margin:6px 0 0;color:var(--ink);word-break:keep-all}
.term .go{margin:8px 0 0;font-size:14px;font-weight:500}
.src{margin-top:8px;font-size:13px;color:var(--muted)}
.src summary{cursor:pointer;width:max-content}
.src ul{margin:6px 0 0;padding-left:1.2em}
.term:target{background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:8px;padding-inline:10px;margin-inline:-10px}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);word-break:keep-all}
@media (max-width:560px){.toc .tg{min-width:0;width:100%}}
</style>

<div class="wrap">
  __NAV__
  <header>
    <h1>위스키 용어 사전</h1>
    <p class="lede">라벨과 티어표 필터에 나오는 낱말 __COUNT__개를 풀이했습니다. 법으로 정한 표기는 법령 원문을, 관행으로 쓰는 표기는 백과사전·업계 자료를 근거로 달았습니다. 나라마다 정의가 다른 낱말은 차이를 함께 적었습니다.</p>
  </header>
  <ul class="toc" aria-label="용어 목록">__TOC__</ul>
  __TERMS__
  <p class="foot">풀이는 근거 자료를 요약한 것입니다. 정확한 정의는 각 항목의 근거 자료 원문을 확인하세요. 티어표의 속성 표시(피트·CS 등)는 일부가 원문 대조 전 값입니다.</p>
</div>
