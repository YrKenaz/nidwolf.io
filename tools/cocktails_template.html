<title>위스키 칵테일 제조법 — 잔 그림으로 보는 재료 순서와 양</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
/* 색 토큰은 build.py 가 tools/template.html 에서 그대로 가져온다(두 페이지 공통) */
__TOKENS__

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* 사이트 메뉴(페이지 이동). 티어표 안의 보기 전환(상자형 단추)과 구분되게 글자 탭 + 밑줄로 둔다 */
.site{display:flex;flex-wrap:wrap;gap:4px 22px;border-bottom:1px solid var(--line);margin:0 0 22px;font-size:14.5px}
.site a{color:var(--muted);text-decoration:none;padding:6px 0 9px;border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:500}
.site a:hover{color:var(--ink)}
.site a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
h1{font-family:var(--display);font-weight:900;font-size:clamp(28px,5vw,44px);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em;word-break:keep-all}
.lede{color:var(--muted);margin:10px 0 0;max-width:62ch;word-break:keep-all}
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0 0 6px}
button{font:inherit;color:inherit}
a{color:var(--accent)}
/* 가진 재료로 찾기 */
.kbar{margin:22px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px}
.kbar>summary{cursor:pointer;padding:11px 0;font-weight:700;font-size:15px}
.kbar[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
.bon{font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.bnote2{font-size:13px;color:var(--muted);margin:0 0 8px;word-break:keep-all}
.bbtn{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.bmsg{font-size:12.5px;color:var(--muted)}
.bgr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 9px}
.bwrap{display:inline-flex;align-items:center;gap:4px}
.btier{font-size:12px;text-decoration:none;color:var(--accent);white-space:nowrap}
.btier:hover{text-decoration:underline}
.cgrid>.sech{grid-column:1/-1;list-style:none;margin:10px 0 -2px}
.cgrid>.sech h3{font-size:15px;margin:0}.cgrid>.sech h3 small{font-weight:400;color:var(--muted);margin-left:4px}
.cgrid>.sech p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.cgrid>li.dim>.ccard{opacity:.45}
.cgrid>li.dim>.ccard:hover,.cgrid>li.dim>.ccard:focus-visible{opacity:1}
.cgrid>li{display:flex;flex-direction:column;gap:4px}
.miss{margin:0;font-size:12.5px;padding:0 4px;word-break:keep-all}
.miss a{margin-left:6px;white-space:nowrap}
.cbar{margin:22px 0 14px;display:flex;flex-direction:column;gap:8px}
.cg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cgl{font-size:13px;color:var(--muted);min-width:76px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.cnt{font-size:13px;color:var(--muted)}
.cgrid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ccard{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none;height:100%}
.ccard:hover{border-color:var(--accent)}
.ccard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cfig{flex:0 0 72px;color:var(--ink)}
.gl{display:block;width:100%;height:auto;color:var(--ink);overflow:visible}
.gl.sm{height:96px}
.cfig>svg,.big>svg{display:block;width:100%;height:auto}   /* 전담 그림(art/cocktails/*.svg)도 같은 칸 크기로 */
.cfig>svg{height:96px}
.cbody{display:flex;flex-direction:column;gap:2px;min-width:0}
.cn{font-weight:700;font-size:16px;word-break:keep-all}
.ce{font-size:12.5px;color:var(--muted)}
.cm{font-size:12.5px;color:var(--muted);word-break:keep-all}
.df{color:var(--ink)}
.tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tg span{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:0 7px}
.recipes{margin-top:40px}
.recipe{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:28px;padding:24px 0;border-top:1px solid var(--line)}
.big{margin:0}
.big figcaption{font-size:12.5px;color:var(--muted);margin-top:6px;word-break:keep-all}
.gl .lb{font-size:13px;font-weight:700;fill:currentColor}
.gl .la{font-size:12px;fill:var(--muted)}
.gl .lc{font-size:12px;fill:currentColor}
.rtext h3{font-family:var(--display);font-size:24px;line-height:1.25;margin:0;word-break:keep-all}
.rtext h3 small{display:block;font-family:var(--body);font-size:14px;font-weight:400;color:var(--muted)}
.rtext h4{font-size:14px;margin:18px 0 6px}
.rtext h4 small{font-weight:400;color:var(--muted)}
.rmeta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0}
.rmeta span{border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12.5px}
.ing{border-collapse:collapse;width:100%;font-size:14px}
.ing td{border-top:1px solid var(--line);padding:6px 6px}
.ing .no{width:2em;font-weight:700}
.ing .amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ing small{color:var(--muted)}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid var(--ink);margin-right:7px;vertical-align:-1px}
.steps{margin:0;padding-left:1.4em}
.steps li{margin:3px 0;word-break:keep-all}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;word-break:keep-all}
/* 이 칵테일에 쓰는 종류의 병(빌드 때 티어표에서 고른 병, 규칙은 .bnote 에 적는다) */
.bnote{font-size:12.5px;color:var(--muted);margin:0 0 8px;word-break:keep-all}
.bgrp{margin:0 0 10px}
.bgh{font-size:13px;font-weight:700;margin:0 0 4px}
.bl{list-style:none;margin:0 0 4px;padding:0;display:flex;flex-direction:column}
.bl a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 4px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px}
.bl a:hover .bn{text-decoration:underline}
.bt{display:inline-block;min-width:22px;text-align:center;border-radius:4px;font-size:12px;font-weight:700;padding:1px 4px}
.bt[data-t="S"]{background:var(--t-s);color:var(--t-dark-ink)}.bt[data-t="A"]{background:var(--t-a);color:var(--t-dark-ink)}.bt[data-t="B"]{background:var(--t-b);color:var(--t-dark-ink)}
.bt[data-t="C"]{background:var(--t-c);color:var(--t-light-ink)}.bt[data-t="D"]{background:var(--t-d);color:var(--t-light-ink)}.bt[data-t="E"]{background:var(--t-e);color:var(--t-light-ink)}
.bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bp{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ball{display:inline-block;font-size:14px;font-weight:500;margin-top:2px}
.srcl{margin:0;padding-left:1.2em;font-size:13.5px}
.warn{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);word-break:keep-all}
.js .recipes{display:none}
/* 상세 펼침(카드가 있는 줄 바로 아래, 격자 전체 폭). 높이는 grid-template-rows 0fr→1fr 로 펼친다. 다 펼친 뒤에는 overflow 를 풀어 sticky 가 동작하게 한다 */
.cgrid>.cpanel{grid-column:1/-1;list-style:none;display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}
.cgrid>.cpanel.open{grid-template-rows:1fr}
.cpin{min-height:0;overflow:hidden}
.cpanel.done .cpin{overflow:visible}
.cpbody{border:1px solid var(--accent);border-radius:14px;background:var(--surface);padding:0 20px 24px;margin:2px 0 10px}
/* 이름 띠: 스크롤과 관계없이 늘 보이는 칵테일 이름·속성과 단추(sticky) */
.cpband{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:14px}
.cpname{flex:1 1 260px;min-width:0}
.cpname b{font-family:var(--display);font-size:20px;line-height:1.25;word-break:keep-all}
.cpname small{color:var(--muted);font-size:13px;margin-left:6px}
.cptags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.cptags span{border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px}
.cptool{display:flex;gap:6px;flex:0 0 auto}
.cpanel .recipe{border-top:0;padding:0}
.cpanel .big{position:sticky;top:calc(var(--bandh,60px) + 12px);align-self:start}
.cpanel .rtext>h3{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}   /* 이름은 띠에 보이므로 본문 제목은 화면 낭독·포커스용으로만 */
.cpanel .rtext>.rmeta{display:none}
.ccard[aria-expanded="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.adds{display:none}
.ingall>summary{list-style:none;cursor:default}.ingall>summary::-webkit-details-marker{display:none}
.ingall>summary h4{display:inline}
/* 스크롤 연출(만드는 법 중심). 지금 단계 = 문장이 읽는 자리(PC 화면 가운데, 휴대폰은 위에 붙은 그림 아래 영역의 가운데)를 지난 마지막 단계.
   지난 단계는 약하게, 다음 단계는 흐리게 미리 보인다. 투명도만 바꿔 레이아웃은 그대로(숨긴 글 없음) */
.story .ingall{border:1px solid var(--line);border-radius:10px;padding:2px 12px;margin-bottom:6px}
.story .ingall>summary{cursor:pointer;list-style:revert;padding:6px 0}
.story .ingall>summary h4{margin:0}
.story .adds{display:block;list-style:none;margin:8px 0 0;padding:0;font-size:13.5px}
.story .adds li{margin:3px 0}
.story .steps{padding-left:1.4em}
.story .steps>li{min-height:var(--steph,220px);padding:8px 0 8px 12px;border-left:3px solid transparent;transition:opacity .2s ease,border-color .2s ease;opacity:.32}
.story .steps>li.past{opacity:.6}
.story .steps>li.now{opacity:1;border-left-color:var(--accent)}
.story .steps>li.now .stx{font-weight:700}
.story .rtail{transition:opacity .2s ease;opacity:.32}.story .rtail.now,.story .rtail.past{opacity:1}
.story .sth{margin-top:var(--s1,0px)}
.cphint{display:none}
.story .cphint{display:block;margin:10px 0 0;font-size:13.5px;color:var(--muted)}
.story .cphint::after{content:" ↓";display:inline-block;animation:cpb 1.6s ease-in-out infinite}
@keyframes cpb{50%{transform:translateY(4px)}}
/* 그림: 재료(data-i)·얼음·가니시·김을 단계에 맞춰 켠다. 한 단계에 재료가 여럿이면 넣는 순서대로 짧은 시차 */
.big .cka-step,.big .cka-garnish,.big .cka-steam,.big .cka-ice{transition:opacity .3s ease}
.big .cka-step.off,.big .cka-garnish.off,.big .cka-steam.off,.big .cka-ice.off{opacity:0;transition-delay:0s!important}
.big .cka-layer.off{opacity:1}
.big .cka-layer>*{transform-box:view-box;transform-origin:0 var(--y0,0px);transition:transform .35s ease;transition-delay:inherit}   /* clip-path 는 묶음(g)에 걸려 있으므로 안쪽만 변형한다 */
.big .cka-layer.off>*{transform:scaleY(0);transition-delay:0s!important}
.cpanel.jump .big *{transition:none!important}   /* 빠르게 여러 단계를 건너뛰면 즉시 반영 */
@media (prefers-reduced-motion:reduce){.cgrid>.cpanel,.story .steps>li,.big .cka-step,.big .cka-layer>*{transition:none}.story .cphint::after{animation:none}}
@media print{*{transition:none!important}.off{opacity:1!important;transform:none!important}.big .cka-layer.off>*{transform:none!important}.cptool{display:none}.story .steps>li,.story .rtail{opacity:1!important}}
@media (max-width:760px){
  .recipe{grid-template-columns:minmax(0,1fr);gap:14px}
  .big{max-width:420px}
  /* 좁은 화면: 이름 띠 + 그림이 위에 붙는다(합쳐서 화면의 40% 이하) */
  .cpanel .big{max-width:none;top:var(--bandh,52px);z-index:3;background:var(--surface);padding:4px 0 2px;border-bottom:1px solid var(--line)}
  .cpanel .big>svg{max-height:36vh;width:auto;max-width:100%;margin:0 auto}
  .cpanel.story .big>svg{max-height:26vh}
  .cpanel.story .big figcaption{display:none}
  .cpanel .big figcaption{font-size:11px;margin:2px 0 0}
}
@media (max-width:560px){
  .cpbody{padding:0 12px 20px;margin-inline:-4px}
  .cpband{padding:8px 0;margin-bottom:6px;gap:6px}
  .cpname b{font-size:17px}.cptags{display:none}   /* 휴대폰 띠는 이름과 단추만 */
  .cpname{flex-basis:0}
  .cptool .chip{padding:3px 10px;font-size:12.5px}
  .cgrid{grid-template-columns:minmax(0,1fr)}
  .cgl{min-width:0;width:100%}
}
</style>

<div class="wrap">
  __NAV__
  <header>
    <h1>위스키 칵테일 제조법</h1>
    <p class="lede">위스키로 만드는 칵테일을 잔 그림으로 정리했습니다. 잔 속 색 층은 재료를 넣는 순서(아래부터)이고, 층의 크기는 들어가는 양에 비례합니다. 비터스·설탕처럼 양을 ml로 재지 않는 재료는 잔 아래에 번호와 함께 따로 적었습니다.</p>
  </header>
  __BAR__
  <div class="cbar" id="cbar" hidden>__FILTERS__<p class="cnt" id="cnt" role="status" aria-live="polite"></p></div>
  <ul class="cgrid" id="cgrid">__CARDS__</ul>
  <section class="recipes" id="recipes" aria-label="칵테일 제조법 전체"><h2>제조법</h2>__RECIPES__</section>
  <p class="warn">__WARN__</p>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id),D=document.documentElement;D.classList.add("js");
const N=__COUNT__,f={base:[],diff:[],method:[]};$("cbar").hidden=false;
/* 가진 재료로 찾기(N5). 묶음 데이터 {id:[이름, 종류 줄, 흔한 것, 티어표 종류]}. 고른 묶음은 localStorage nidwolf.bar.v1 {"g":[…]}에만 두고 주소에는 넣지 않는다 */
const BG=(()=>{try{return JSON.parse($("bgdata").textContent)}catch(e){return null}})(),kb=$("kbar"),KEY="nidwolf.bar.v1";
const TK={BB:"버번",RY:"라이·아메리칸",SM:"싱글몰트 스카치",BL:"블렌디드 스카치",IR:"아이리시",JP:"재패니즈"};
let have=new Set(),stOK=true;
if(BG&&kb){kb.hidden=false;let sv=null;
  try{sv=JSON.parse(localStorage.getItem(KEY)||"null");localStorage.setItem(KEY+".t","1");localStorage.removeItem(KEY+".t")}catch(e){stOK=false}
  have=new Set(sv&&Array.isArray(sv.g)?sv.g.filter(g=>BG[g]):Object.keys(BG).filter(g=>BG[g][2]));   /* 처음에는 흔한 것만 켠 상태 */
  if(!stOK)$("bmsg").textContent="이 브라우저는 저장을 막아 두어, 고른 재료는 페이지를 닫으면 사라집니다."}
const save=()=>{if(stOK)try{localStorage.setItem(KEY,JSON.stringify({g:[...have]}))}catch(e){}};
/* 흔한 것(설탕·꿀 등)만 켠 상태에서는 구분하지 않는다: 흔하지 않은 재료를 하나라도 켜야 "바로/하나 더"로 나눈다 */
const active=()=>!!BG&&[...have].some(g=>BG[g]&&!BG[g][2]);
const href=h=>window.siteHref?siteHref(h):h,esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function missHTML(r){const ts=[...new Set(r.map(g=>BG[g]&&BG[g][3]).filter(Boolean))];
  const lk=!ts.length?"":ts.length>2?`<a href="${href("./")}">티어표에서 위스키 고르기 →</a>`:ts.map(t=>`<a href="${href("./#type="+t)}">${TK[t]} 티어 →</a>`).join("");
  return `<p class="miss"><b>하나만 더:</b> ${esc(r.map(g=>BG[g]?BG[g][0]:g).join(" 또는 "))}${lk?" "+lk:""}</p>`}
document.querySelectorAll("#cgrid>li").forEach((li,i)=>li.dataset.o=i);
function apply(){let n=0,a=0,b=0;const on=active(),G=$("cgrid"),items=[...G.querySelectorAll(":scope>li[data-o]")];
  G.querySelectorAll(":scope>.sech").forEach(x=>x.remove());
  items.forEach(li=>{const ok=(!f.base.length||li.dataset.base.split(" ").some(b=>f.base.includes(b)))&&(!f.diff.length||f.diff.includes(li.dataset.diff))&&(!f.method.length||f.method.includes(li.dataset.method));
    li.hidden=!ok;n+=ok;li.classList.remove("dim");const m=li.querySelector(".miss");if(m)m.remove();li.dataset.lv="3";
    if(on&&ok){const miss=(li.dataset.req||"").split(";").filter(Boolean).map(r=>r.split("|")).filter(r=>!r.some(g=>have.has(g)));
      li.dataset.lv=String(Math.min(2,miss.length));if(!miss.length)a++;else if(miss.length===1){b++;li.insertAdjacentHTML("beforeend",missHTML(miss[0]))}else li.classList.add("dim")}});
  items.sort((x,y)=>(on?x.dataset.lv-y.dataset.lv:0)||x.dataset.o-y.dataset.o).forEach(li=>G.append(li));
  if(on){const head=(lv,t,k,empty)=>{const first=items.find(li=>!li.hidden&&li.dataset.lv===lv);const h=document.createElement("li");h.className="sech";
      h.innerHTML=`<h3>${t} <small>${k}종</small></h3>`+(k?"":`<p>${empty}</p>`);first?G.insertBefore(h,first):(lv!=="2"&&G.insertBefore(h,items.find(li=>!li.hidden&&+li.dataset.lv>+lv)||null))};
    head("0","바로 만들 수 있음",a,"지금 켠 재료로 바로 만들 수 있는 칵테일은 없습니다.");head("1","하나만 더 있으면",b,"재료가 하나만 빠진 칵테일은 없습니다.");
    const c=n-a-b;if(c)head("2","그 밖의 칵테일",c,"")}
  $("cnt").textContent=(n===N?`${N}종`:`${N}종 중 ${n}종`)+(on?` · 바로 만들 수 있음 ${a} · 하나만 더 있으면 ${b}`:"");
  panelSync();
  if(kb){$("bon").textContent=on?`바로 ${a} · 하나 더 ${b}`:have.size?`${have.size}개 켬`:"";kb.querySelectorAll("[data-g]").forEach(x=>x.setAttribute("aria-pressed",have.has(x.dataset.g)))}}
if(kb)kb.addEventListener("click",e=>{const c=e.target.closest("[data-g]"),t=e.target.id;
  if(c){const g=c.dataset.g;have.has(g)?have.delete(g):have.add(g)}else if(t==="bcommon")Object.keys(BG).forEach(g=>{if(BG[g][2])have.add(g)});else if(t==="bnone")have.clear();else return;
  save();apply()});
$("cbar").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;const a=f[b.dataset.k],i=a.indexOf(b.dataset.v);i<0?a.push(b.dataset.v):a.splice(i,1);b.setAttribute("aria-pressed",i<0);apply()});
apply();
/* 상세: 카드를 누르면 그 줄 바로 아래로 펼친다. 주소는 #c=<id>(JS 없을 때 쓰는 #c-<id> 앵커도 받음), 뒤로 가기·같은 카드·접기·Esc 로 접힌다.
   본문 article 은 복사하지 않고 숨은 #recipes 에서 옮겨 왔다가 접을 때 제자리로 돌려놓는다(그림 안 id·clip-path 가 겹치지 않게) */
var P=null,openId=null,pushed=false,lastCard=null,raf=0,stages=[];
const RM=matchMedia("(prefers-reduced-motion: reduce)"),MOB=matchMedia("(max-width:760px)"),MKEY="nidwolf.ckstory.v1";
let mode="story";try{if(localStorage.getItem(MKEY)==="all")mode="all"}catch(e){}
const story=()=>mode==="story"&&!RM.matches;
document.querySelectorAll("#cgrid a[data-id]").forEach(a=>a.setAttribute("aria-expanded","false"));
const idOf=()=>{const m=location.hash.match(/^#c[=-]([a-z0-9-]+)$/);return m&&$("c-"+m[1])?m[1]:null};
const cardOf=id=>document.querySelector(`#cgrid a[data-id="${id}"]`),liOf=id=>{const a=cardOf(id);return a&&a.parentElement};
function panelSync(){if(P)place()}
function place(){if(!P)return;const li=liOf(openId);
  if(!li||li.hidden){if(idOf())history.replaceState(null,"",location.pathname+location.search);pushed=false;collapse();return}   /* 필터로 걸러지면 접는다 */
  const top=li.offsetTop;let last=li,el=li.nextElementSibling;
  while(el){if(el!==P){if(!el.matches("li[data-o]"))break;if(!el.hidden){if(el.offsetTop!==top)break;last=el}}el=el.nextElementSibling}
  if(last.nextElementSibling!==P)last.after(P)}
function open(id){const a=$("c-"+id);if(!a||openId===id&&P)return;if(P)collapse();
  openId=id;const card=cardOf(id),h3=a.querySelector("h3"),nm=h3.firstChild.textContent.trim(),en=(h3.querySelector("small")||{}).textContent||"";
  P=document.createElement("li");P.className="cpanel";P.setAttribute("role","region");P.setAttribute("aria-labelledby","h-"+id);
  /* 이름 띠(sticky): 이름·영문·속성과 단추. 본문 제목은 화면 낭독·포커스용으로 남긴다 */
  P.innerHTML=`<div class="cpin"><div class="cpbody"><div class="cpband"><div class="cpname" aria-hidden="true"><b>${esc(nm)}</b><small>${esc(en)}</small><span class="cptags">${a.querySelector(".rmeta").innerHTML}</span></div><div class="cptool">${RM.matches?"":`<button type="button" class="chip cpmode" aria-pressed="${mode==="all"}">전체 한 번에 보기</button>`}<button type="button" class="chip cpclose" aria-label="${esc(nm)} 접기">접기 ✕</button></div></div></div></div>`;
  a._ph=document.createComment("");a.before(a._ph);P.querySelector(".cpbody").append(a);
  if(!a.querySelector(".cphint"))a.querySelector(".sth").insertAdjacentHTML("beforebegin",'<p class="cphint" aria-hidden="true">아래로 내리면 만드는 법 단계마다 그 단계에서 넣는 재료가 잔에 채워집니다</p>');
  liOf(id).after(P);place();if(card)card.setAttribute("aria-expanded","true");
  setup();
  const toTop=b=>{if(P)scrollTo({top:Math.max(0,P.getBoundingClientRect().top+scrollY-8),behavior:b})};
  const done=()=>{if(P){P.classList.add("done");toTop("auto");setup()}};   /* 펼침이 끝나 페이지 높이가 늘어난 뒤 다시 맞춘다(주소로 바로 열 때 위치가 모자라지 않게) */
  if(RM.matches){P.classList.add("open");done()}else{requestAnimationFrame(()=>requestAnimationFrame(()=>P&&P.classList.add("open")));setTimeout(done,450)}
  h3.focus({preventScroll:true});
  requestAnimationFrame(()=>toTop(RM.matches?"auto":"smooth"))}
function collapse(){if(!P)return;const a=P.querySelector("article");
  a.querySelectorAll(".off,.now,.past").forEach(x=>x.classList.remove("off","now","past"));a.querySelectorAll(".big [style]").forEach(x=>x.style.transitionDelay="");
  const d=a.querySelector(".ingall");if(d)d.open=true;["--s1","--steph","--bandh"].forEach(k=>a.style.removeProperty(k));
  if(a._ph){a._ph.replaceWith(a);a._ph=null}
  const card=cardOf(openId);if(card)card.setAttribute("aria-expanded","false");P.remove();P=null;openId=null;stages=[];lastCur=null}
var lastCur=null;
/* 읽는 자리: PC 는 화면 가운데, 좁은 화면은 위에 붙은 이름 띠·그림 아래 영역의 가운데 */
function readLine(){if(!P)return innerHeight/2;if(!MOB.matches)return innerHeight*.5;
  const top=(P.querySelector(".cpband").offsetHeight||0)+(P.querySelector(".big").offsetHeight||0);return top+(innerHeight-top)/2}
function setup(){if(!P)return;const a=P.querySelector("article"),on=story();P.classList.toggle("story",on);
  P.style.setProperty("--bandh",P.querySelector(".cpband").offsetHeight+"px");
  stages=[...a.querySelectorAll(".steps>li[data-s], .rtail[data-s]")];
  a.querySelectorAll(".big .cka-layer").forEach(g=>g.style.setProperty("--y0",(g.dataset.y0||0)+"px"));
  const d=a.querySelector(".ingall");if(d)d.open=!on;   /* 연출 중에는 "재료 한눈에"를 접어 두고, 전체 보기에서는 펼친다 */
  a.style.setProperty("--s1","0px");
  if(on){const vh=innerHeight,stick=MOB.matches?(P.querySelector(".cpband").offsetHeight+P.querySelector(".big").offsetHeight):0;
    /* 한 단계 = 휠 서너 칸(손가락 한 번) 정도: 단계 블록 최소 높이를 화면 높이에 맞춰 고정 범위로 */
    a.style.setProperty("--steph",Math.round(Math.max(170,Math.min(300,(vh-stick)*.42)))+"px");
    /* 펼친 직후에는 시작 상태: 첫 단계가 읽는 자리보다 조금 아래에서 시작하게 그 위를 띄운다 */
    const f=a.querySelector('.steps>li[data-s="1"]');if(f){const rel=f.getBoundingClientRect().top-P.getBoundingClientRect().top;a.style.setProperty("--s1",Math.max(0,Math.round(readLine()+40-rel-8))+"px")}}
  lastCur=null;update()}
function update(){raf=0;if(!P)return;const a=P.querySelector("article"),on=story();let cur=1e9;
  if(on){const t=readLine();cur=0;stages.forEach(el=>{if(el.getBoundingClientRect().top<t)cur=Math.max(cur,+el.dataset.s)})}
  stages.forEach(el=>{const s=+el.dataset.s;el.classList.toggle("now",on&&s===cur);el.classList.toggle("past",on&&s<cur)});
  if(lastCur!==null&&Math.abs(cur-lastCur)>1&&cur<1e9){P.classList.add("jump");requestAnimationFrame(()=>requestAnimationFrame(()=>P&&P.classList.remove("jump")))}
  const ist=(a.dataset.ist||"").split(",").map(Number),seen={};
  a.querySelectorAll(".big .cka-step").forEach(g=>{const i=+g.dataset.i,st=ist[i]||1,show=st<=cur;
    if(show&&g.classList.contains("off")){const ord=ist.slice(0,i).filter(x=>x===st).length;g.style.transitionDelay=(lastCur===null||P.classList.contains("jump")?0:ord*.18)+"s"}   /* 같은 단계 안에서는 넣는 순서대로 시차 */
    g.classList.toggle("off",!show)});
  const at=k=>k!==""&&k!==undefined&&cur>=+k;
  a.querySelectorAll(".big .cka-ice").forEach(g=>g.classList.toggle("off",!at(a.dataset.ice||"0")));
  /* 가니시·김의 단계가 정해져 있지 않으면 마지막(꼬리) 단계에서 보인다 */
  a.querySelectorAll(".big .cka-garnish").forEach(g=>g.classList.toggle("off",!at(a.dataset.garn||a.dataset.last)));
  a.querySelectorAll(".big .cka-steam").forEach(g=>g.classList.toggle("off",!at(a.dataset.steam||a.dataset.last)));
  a.dataset.cur=cur>=1e9?"all":cur;lastCur=cur}
addEventListener("scroll",()=>{if(P&&!raf)raf=requestAnimationFrame(update)},{passive:true});
let rz=0;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(P){place();setup()}},120)});
function route(){const id=idOf();if(id)open(id);else if(P){collapse();if(lastCard){lastCard.focus({preventScroll:true});lastCard=null}}}
function leave(){if(pushed){pushed=false;history.back()}else{history.replaceState(null,"",location.pathname+location.search);route()}}
$("cgrid").addEventListener("click",e=>{
  if(e.target.closest(".cpclose")){leave();return}
  const m=e.target.closest(".cpmode");if(m){mode=mode==="story"?"all":"story";try{localStorage.setItem(MKEY,mode)}catch(err){}m.setAttribute("aria-pressed",mode==="all");setup();return}
  const a=e.target.closest("a[data-id]");if(!a||e.metaKey||e.ctrlKey||e.shiftKey)return;e.preventDefault();
  if(openId===a.dataset.id){leave();return}
  lastCard=a;if(P){history.replaceState(null,"","#c="+a.dataset.id);open(a.dataset.id)}else{pushed=true;location.hash="c="+a.dataset.id}});   /* 펼친 채 다른 카드로 바꿀 때는 방문 기록을 쌓지 않는다 */
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&P&&!e.defaultPrevented){lastCard=lastCard||cardOf(openId);leave()}});
addEventListener("hashchange",()=>{if(!idOf())pushed=false;route()});
if(idOf())route();
})();
</script>
