<title>위스키 칵테일 제조법 — 잔 그림으로 보는 재료 순서와 양</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
/* 색 토큰은 build.py 가 tools/template.html 에서 그대로 가져온다(두 페이지 공통) */
__TOKENS__

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* 사이트 메뉴(페이지 이동). 티어표 안의 보기 전환(상자형 단추)과 구분되게 글자 탭 + 밑줄로 둔다 */
.site{display:flex;flex-wrap:wrap;gap:4px 22px;border-bottom:1px solid var(--line);margin:0 0 22px;font-size:14.5px}
.site a{color:var(--muted);text-decoration:none;padding:6px 0 9px;border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:500}
.site a:hover{color:var(--ink)}
.site a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
h1{font-family:var(--display);font-weight:900;font-size:clamp(28px,5vw,44px);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em;word-break:keep-all}
.lede{color:var(--muted);margin:10px 0 0;max-width:62ch;word-break:keep-all}
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0 0 6px}
button{font:inherit;color:inherit}
a{color:var(--accent)}
/* 가진 재료로 찾기 */
.kbar{margin:22px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px}
.kbar>summary{cursor:pointer;padding:11px 0;font-weight:700;font-size:15px}
.kbar[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
.bon{font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.bnote2{font-size:13px;color:var(--muted);margin:0 0 8px;word-break:keep-all}
.bbtn{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.bmsg{font-size:12.5px;color:var(--muted)}
.bgr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 9px}
.bwrap{display:inline-flex;align-items:center;gap:4px}
.btier{font-size:12px;text-decoration:none;color:var(--accent);white-space:nowrap}
.btier:hover{text-decoration:underline}
.cgrid>.sech{grid-column:1/-1;list-style:none;margin:10px 0 -2px}
.cgrid>.sech h3{font-size:15px;margin:0}.cgrid>.sech h3 small{font-weight:400;color:var(--muted);margin-left:4px}
.cgrid>.sech p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.cgrid>li.dim>.ccard{opacity:.45}
.cgrid>li.dim>.ccard:hover,.cgrid>li.dim>.ccard:focus-visible{opacity:1}
.cgrid>li{display:flex;flex-direction:column;gap:4px}
.miss{margin:0;font-size:12.5px;padding:0 4px;word-break:keep-all}
.miss a{margin-left:6px;white-space:nowrap}
.cbar{margin:22px 0 14px;display:flex;flex-direction:column;gap:8px}
.cg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cgl{font-size:13px;color:var(--muted);min-width:76px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.cnt{font-size:13px;color:var(--muted)}
.cgrid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ccard{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none;height:100%}
.ccard:hover{border-color:var(--accent)}
.ccard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cfig{flex:0 0 72px;color:var(--ink)}
.gl{display:block;width:100%;height:auto;color:var(--ink);overflow:visible}
.gl.sm{height:96px}
.cfig>svg,.big>svg{display:block;width:100%;height:auto}   /* 전담 그림(art/cocktails/*.svg)도 같은 칸 크기로 */
.cfig>svg{height:96px}
.cbody{display:flex;flex-direction:column;gap:2px;min-width:0}
.cn{font-weight:700;font-size:16px;word-break:keep-all}
.ce{font-size:12.5px;color:var(--muted)}
.cm{font-size:12.5px;color:var(--muted);word-break:keep-all}
.df{color:var(--ink)}
.tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tg span{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:0 7px}
.recipes{margin-top:40px}
.recipe{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:28px;padding:24px 0;border-top:1px solid var(--line)}
.big{margin:0}
.big figcaption{font-size:12.5px;color:var(--muted);margin-top:6px;word-break:keep-all}
.gl .lb{font-size:13px;font-weight:700;fill:currentColor}
.gl .la{font-size:12px;fill:var(--muted)}
.gl .lc{font-size:12px;fill:currentColor}
.rtext h3{font-family:var(--display);font-size:24px;line-height:1.25;margin:0;word-break:keep-all}
.rtext h3 small{display:block;font-family:var(--body);font-size:14px;font-weight:400;color:var(--muted)}
.rtext h4{font-size:14px;margin:18px 0 6px}
.rtext h4 small{font-weight:400;color:var(--muted)}
.rmeta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0}
.rmeta span{border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12.5px}
.ing{border-collapse:collapse;width:100%;font-size:14px}
.ing td{border-top:1px solid var(--line);padding:6px 6px}
.ing .no{width:2em;font-weight:700}
.ing .amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ing small{color:var(--muted)}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid var(--ink);margin-right:7px;vertical-align:-1px}
.steps{margin:0;padding-left:1.4em}
.steps li{margin:3px 0;word-break:keep-all}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;word-break:keep-all}
/* 이 칵테일에 쓰는 종류의 병(빌드 때 티어표에서 고른 병, 규칙은 .bnote 에 적는다) */
.bnote{font-size:12.5px;color:var(--muted);margin:0 0 8px;word-break:keep-all}
.bgrp{margin:0 0 10px}
.bgh{font-size:13px;font-weight:700;margin:0 0 4px}
.bl{list-style:none;margin:0 0 4px;padding:0;display:flex;flex-direction:column}
.bl a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 4px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px}
.bl a:hover .bn{text-decoration:underline}
.bt{display:inline-block;min-width:22px;text-align:center;border-radius:4px;font-size:12px;font-weight:700;padding:1px 4px}
.bt[data-t="S"]{background:var(--t-s);color:var(--t-dark-ink)}.bt[data-t="A"]{background:var(--t-a);color:var(--t-dark-ink)}.bt[data-t="B"]{background:var(--t-b);color:var(--t-dark-ink)}
.bt[data-t="C"]{background:var(--t-c);color:var(--t-light-ink)}.bt[data-t="D"]{background:var(--t-d);color:var(--t-light-ink)}.bt[data-t="E"]{background:var(--t-e);color:var(--t-light-ink)}
.bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bp{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ball{display:inline-block;font-size:14px;font-weight:500;margin-top:2px}
.srcl{margin:0;padding-left:1.2em;font-size:13.5px}
.warn{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);word-break:keep-all}
dialog.cd{border:0;padding:0;background:var(--bg);color:var(--ink);border-radius:14px;width:min(980px,calc(100vw - 32px));max-height:calc(100dvh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog.cd::backdrop{background:rgba(0,0,0,.55)}
.cdb{padding:20px 24px 24px;overflow:auto;max-height:calc(100dvh - 32px)}
.cdb .recipe{border-top:0;padding:0}
.cdb h3:focus{outline:none}
.cdb .close{display:block;margin:18px 0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 16px;cursor:pointer}
.js .recipes{display:none}
@media (max-width:760px){
  .recipe{grid-template-columns:minmax(0,1fr);gap:14px}
  .big{max-width:420px}
}
@media (max-width:560px){
  .cgrid{grid-template-columns:minmax(0,1fr)}
  dialog.cd{width:100vw;max-width:100vw;max-height:100dvh;height:100dvh;border-radius:0;margin:0}
  .cdb{max-height:100dvh;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
  .cgl{min-width:0;width:100%}
}
</style>

<div class="wrap">
  __NAV__
  <header>
    <h1>위스키 칵테일 제조법</h1>
    <p class="lede">위스키로 만드는 칵테일을 잔 그림으로 정리했습니다. 잔 속 색 층은 재료를 넣는 순서(아래부터)이고, 층의 크기는 들어가는 양에 비례합니다. 비터스·설탕처럼 양을 ml로 재지 않는 재료는 잔 아래에 번호와 함께 따로 적었습니다.</p>
  </header>
  __BAR__
  <div class="cbar" id="cbar" hidden>__FILTERS__<p class="cnt" id="cnt" role="status" aria-live="polite"></p></div>
  <ul class="cgrid" id="cgrid">__CARDS__</ul>
  <section class="recipes" id="recipes" aria-label="칵테일 제조법 전체"><h2>제조법</h2>__RECIPES__</section>
  <p class="warn">__WARN__</p>
</div>
<dialog class="cd" id="cd" aria-labelledby="cdh"><div class="cdb" id="cdb"></div></dialog>
<script>
(()=>{
const $=id=>document.getElementById(id),D=document.documentElement;D.classList.add("js");
const N=__COUNT__,f={base:[],diff:[],method:[]};$("cbar").hidden=false;
/* 가진 재료로 찾기(N5). 묶음 데이터 {id:[이름, 종류 줄, 흔한 것, 티어표 종류]}. 고른 묶음은 localStorage nidwolf.bar.v1 {"g":[…]}에만 두고 주소에는 넣지 않는다 */
const BG=(()=>{try{return JSON.parse($("bgdata").textContent)}catch(e){return null}})(),kb=$("kbar"),KEY="nidwolf.bar.v1";
const TK={BB:"버번",RY:"라이·아메리칸",SM:"싱글몰트 스카치",BL:"블렌디드 스카치",IR:"아이리시",JP:"재패니즈"};
let have=new Set(),stOK=true;
if(BG&&kb){kb.hidden=false;let sv=null;
  try{sv=JSON.parse(localStorage.getItem(KEY)||"null");localStorage.setItem(KEY+".t","1");localStorage.removeItem(KEY+".t")}catch(e){stOK=false}
  have=new Set(sv&&Array.isArray(sv.g)?sv.g.filter(g=>BG[g]):Object.keys(BG).filter(g=>BG[g][2]));   /* 처음에는 흔한 것만 켠 상태 */
  if(!stOK)$("bmsg").textContent="이 브라우저는 저장을 막아 두어, 고른 재료는 페이지를 닫으면 사라집니다."}
const save=()=>{if(stOK)try{localStorage.setItem(KEY,JSON.stringify({g:[...have]}))}catch(e){}};
/* 흔한 것(설탕·꿀 등)만 켠 상태에서는 구분하지 않는다: 흔하지 않은 재료를 하나라도 켜야 "바로/하나 더"로 나눈다 */
const active=()=>!!BG&&[...have].some(g=>BG[g]&&!BG[g][2]);
const href=h=>window.siteHref?siteHref(h):h,esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function missHTML(r){const ts=[...new Set(r.map(g=>BG[g]&&BG[g][3]).filter(Boolean))];
  const lk=!ts.length?"":ts.length>2?`<a href="${href("./")}">티어표에서 위스키 고르기 →</a>`:ts.map(t=>`<a href="${href("./#type="+t)}">${TK[t]} 티어 →</a>`).join("");
  return `<p class="miss"><b>하나만 더:</b> ${esc(r.map(g=>BG[g]?BG[g][0]:g).join(" 또는 "))}${lk?" "+lk:""}</p>`}
document.querySelectorAll("#cgrid>li").forEach((li,i)=>li.dataset.o=i);
function apply(){let n=0,a=0,b=0;const on=active(),G=$("cgrid"),items=[...G.querySelectorAll(":scope>li[data-o]")];
  G.querySelectorAll(":scope>.sech").forEach(x=>x.remove());
  items.forEach(li=>{const ok=(!f.base.length||li.dataset.base.split(" ").some(b=>f.base.includes(b)))&&(!f.diff.length||f.diff.includes(li.dataset.diff))&&(!f.method.length||f.method.includes(li.dataset.method));
    li.hidden=!ok;n+=ok;li.classList.remove("dim");const m=li.querySelector(".miss");if(m)m.remove();li.dataset.lv="3";
    if(on&&ok){const miss=(li.dataset.req||"").split(";").filter(Boolean).map(r=>r.split("|")).filter(r=>!r.some(g=>have.has(g)));
      li.dataset.lv=String(Math.min(2,miss.length));if(!miss.length)a++;else if(miss.length===1){b++;li.insertAdjacentHTML("beforeend",missHTML(miss[0]))}else li.classList.add("dim")}});
  items.sort((x,y)=>(on?x.dataset.lv-y.dataset.lv:0)||x.dataset.o-y.dataset.o).forEach(li=>G.append(li));
  if(on){const head=(lv,t,k,empty)=>{const first=items.find(li=>!li.hidden&&li.dataset.lv===lv);const h=document.createElement("li");h.className="sech";
      h.innerHTML=`<h3>${t} <small>${k}종</small></h3>`+(k?"":`<p>${empty}</p>`);first?G.insertBefore(h,first):(lv!=="2"&&G.insertBefore(h,items.find(li=>!li.hidden&&+li.dataset.lv>+lv)||null))};
    head("0","바로 만들 수 있음",a,"지금 켠 재료로 바로 만들 수 있는 칵테일은 없습니다.");head("1","하나만 더 있으면",b,"재료가 하나만 빠진 칵테일은 없습니다.");
    const c=n-a-b;if(c)head("2","그 밖의 칵테일",c,"")}
  $("cnt").textContent=(n===N?`${N}종`:`${N}종 중 ${n}종`)+(on?` · 바로 만들 수 있음 ${a} · 하나만 더 있으면 ${b}`:"");
  if(kb){$("bon").textContent=on?`바로 ${a} · 하나 더 ${b}`:have.size?`${have.size}개 켬`:"";kb.querySelectorAll("[data-g]").forEach(x=>x.setAttribute("aria-pressed",have.has(x.dataset.g)))}}
if(kb)kb.addEventListener("click",e=>{const c=e.target.closest("[data-g]"),t=e.target.id;
  if(c){const g=c.dataset.g;have.has(g)?have.delete(g):have.add(g)}else if(t==="bcommon")Object.keys(BG).forEach(g=>{if(BG[g][2])have.add(g)});else if(t==="bnone")have.clear();else return;
  save();apply()});
$("cbar").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;const a=f[b.dataset.k],i=a.indexOf(b.dataset.v);i<0?a.push(b.dataset.v):a.splice(i,1);b.setAttribute("aria-pressed",i<0);apply()});
apply();
/* 상세: #c=<id> (또는 JS 없을 때 쓰는 #c-<id>) 주소로 바로 열린다. 뒤로 가기로 닫힌다 */
const dlg=$("cd");let pushed=false,lastCard=null;
const idOf=()=>{const m=location.hash.match(/^#c[=-]([a-z0-9-]+)$/);return m&&$("c-"+m[1])?m[1]:null};
function open(id){const a=$("c-"+id);
  /* 본문을 복사해 창에 넣는다. 복사본의 id(그림 title 포함)는 원본과 겹치지 않게 "-d"를 붙이고, 제목만 cdh 로 둔다 */
  $("cdb").innerHTML=a.outerHTML.replace(/ (id|aria-labelledby|aria-describedby)="([^"]+)"/g,' $1="$2-d"').split(`"h-${id}-d"`).join('"cdh"')+'<button class="close" type="button" data-close>닫기</button>';
  if(!dlg.open)dlg.showModal();const h=$("cdh");h&&h.focus({preventScroll:true});$("cdb").scrollTop=0}
function close(){if(dlg.open)dlg.close();if(lastCard){lastCard.focus();lastCard=null}}
function route(){const id=idOf();id?open(id):close()}
$("cgrid").addEventListener("click",e=>{const a=e.target.closest("a[data-id]");if(!a||e.metaKey||e.ctrlKey||e.shiftKey)return;e.preventDefault();lastCard=a;pushed=true;location.hash="c="+a.dataset.id});
function leave(){if(pushed){pushed=false;history.back()}else{history.replaceState(null,"",location.pathname+location.search);close()}}
dlg.addEventListener("click",e=>{if(e.target.closest("[data-close]")||e.target===dlg)leave()});
dlg.addEventListener("cancel",e=>{e.preventDefault();leave()});
addEventListener("hashchange",()=>{if(!idOf())pushed=false;route()});
if(idOf())route();
})();
</script>
