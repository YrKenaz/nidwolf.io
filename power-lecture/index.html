<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전력공학 강의 뷰어 — 다산에듀 남민수</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #171d26;
  --panel-2: #1e2530;
  --border: #2a333f;
  --text: #e6eaf0;
  --muted: #97a2b0;
  --accent: #3ea6ff;
  --accent-dim: #1c5c93;
  --ok: #37d67a;
  --warn: #f2b24c;
  --hl: rgba(62,166,255,0.12);
  --hl-border: #3ea6ff;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Pretendard", -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
.muted { color: var(--muted); }
.error { color: #ff8080; }
a { color: var(--accent); text-decoration: none; }

/* ============ INDEX PAGE ============ */
.index-page { max-width: 1100px; margin: 0 auto; padding: 32px 20px 60px; }
.index-header h1 { margin: 0 0 4px; font-size: 1.6rem; }
.index-header .notice { margin-top: 10px; color: var(--muted); }
.lecture-group { margin-top: 34px; }
.lecture-group h2 {
  font-size: 1.05rem; color: var(--accent);
  border-left: 3px solid var(--accent); padding-left: 10px; margin-bottom: 14px;
}
.card-grid {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
}
.lec-card {
  display: block; position: relative;
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 14px 12px; color: var(--text);
  transition: transform .12s ease, border-color .12s ease, background .12s ease;
}
a.lec-card:hover { transform: translateY(-2px); border-color: var(--accent); background: var(--panel-2); }
.lec-card.disabled { opacity: .5; }
.lec-no { font-weight: 700; color: var(--accent); font-size: .85rem; margin-bottom: 4px; }
.lec-title { font-size: .98rem; min-height: 2.6em; }
.lec-meta { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-top: 8px; }
.lec-badge {
  position: absolute; top: 10px; right: 10px; font-size: .68rem;
  padding: 2px 7px; border-radius: 999px; background: var(--panel-2); color: var(--muted);
  border: 1px solid var(--border);
}
.lec-badge.ready { color: var(--ok); border-color: var(--ok); }
.index-footer { margin-top: 40px; font-size: .85rem; }

/* ============ VIEWER PAGE ============ */
.viewer-page { height: 100vh; overflow: hidden; }
.viewer-grid { display: grid; height: 100vh; }

/* 넓은 화면: 좌 영상 / 우 내용 */
@media (min-width: 900px) {
  .viewer-grid { grid-template-columns: minmax(420px, 1fr) minmax(360px, 620px); }
}
/* 좁은 화면: 상 영상 / 하 내용 */
@media (max-width: 899px) {
  .viewer-grid { grid-template-rows: auto 1fr; }
}

.pane-video {
  background: #000; display: flex; flex-direction: column;
  border-right: 1px solid var(--border);
}
.video-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
.video-wrap #player, .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

.statusbar {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--border);
  font-size: .85rem; flex-wrap: wrap;
}
.status-center { flex: 1; min-width: 100px; text-align: center; }
.lec-label { color: var(--text); font-weight: 600; }
.status-right { display: flex; align-items: center; gap: 10px; }
.cur-section { font-size: .8rem; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.toggle-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent-dim); color: #fff; border: 1px solid var(--accent);
  padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: .82rem;
}
.toggle-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.toggle-btn[aria-pressed="false"] { background: var(--panel-2); border-color: var(--border); color: var(--muted); }
.toggle-btn[aria-pressed="false"] .dot { background: var(--muted); }
.back-link { color: var(--muted); }

.calib-btn {
  background: var(--panel-2); color: var(--muted); border: 1px solid var(--border);
  padding: 5px 10px; border-radius: 999px; cursor: pointer; font-size: .8rem;
}
.calib-btn:hover { color: var(--text); border-color: var(--accent); }
.calib-btn.on { background: var(--warn); color: #201500; border-color: var(--warn); font-weight: 600; }

/* 섹션별 보정 버튼(보정 모드에서만 표시) */
.calib-set {
  display: none; margin-left: 8px; font-size: .72rem; cursor: pointer;
  background: var(--warn); color: #201500; border: none; border-radius: 6px; padding: 2px 8px; font-weight: 600;
}
body.calibrating .calib-set { display: inline-block; }
body.calibrating .section { outline: 1px dashed var(--border); outline-offset: 4px; }

/* 보정 바 */
.calib-bar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 25;
  background: var(--panel); border-top: 2px solid var(--warn);
  padding: 10px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  font-size: .82rem;
}
.calib-actions { display: flex; gap: 6px; }

.pane-content { position: relative; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; }

/* 탭바 */
.tabbar { display: flex; gap: 4px; padding: 8px 12px 0; background: var(--panel); border-bottom: 1px solid var(--border); flex: 0 0 auto; }
.tab {
  background: transparent; color: var(--muted); border: 1px solid transparent; border-bottom: none;
  padding: 8px 14px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: .9rem;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); background: var(--bg); border-color: var(--border); font-weight: 600; }

.tabpanel { flex: 1 1 auto; min-height: 0; }
.content {
  overflow-y: auto; padding: 26px 28px 60vh;
  scroll-behavior: auto; outline: none;
}
#problems.content { padding-bottom: 30vh; }
@media (max-width: 899px) { .content { padding: 20px 18px 60vh; } }

/* 기출문제 */
.prob-intro { color: var(--muted); font-size: .88rem; margin-bottom: 16px; }
.calc-box {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 14px; margin-bottom: 20px; position: sticky; top: 0; z-index: 5;
}
.calc-box h4 { margin: 0 0 8px; font-size: .9rem; }
.calc-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.calc-input {
  flex: 1 1 220px; background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-family: ui-monospace, "Consolas", monospace; font-size: .92rem;
}
.calc-result { font-family: ui-monospace, monospace; color: var(--ok); min-width: 80px; font-size: .95rem; }
.calc-hint { color: var(--muted); font-size: .76rem; margin-top: 6px; }

.problem {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 18px; margin-bottom: 16px;
}
.prob-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.prob-no { color: var(--accent); font-weight: 700; font-size: .9rem; }
.prob-tag { font-size: .72rem; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
.prob-q { margin: 4px 0 10px; }
.prob-choices { list-style: none; padding: 0; margin: 0 0 12px; }
.prob-choices li {
  border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; margin-bottom: 6px;
  cursor: pointer; transition: background .12s, border-color .12s;
}
.prob-choices li:hover { border-color: var(--accent); background: var(--panel-2); }
.prob-choices li.picked { border-color: var(--accent); background: var(--hl); }
.prob-choices li.correct { border-color: var(--ok); background: rgba(55,214,122,.12); }
.prob-choices li.wrong { border-color: #ff6b6b; background: rgba(255,107,107,.1); }
.prob-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.prob-btn {
  background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
  padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: .82rem;
}
.prob-btn.wa { border-color: var(--accent-dim); color: var(--accent); }
.prob-btn:hover { filter: brightness(1.1); }
.prob-answer { margin-top: 12px; padding: 12px 14px; border-radius: 8px; background: var(--panel-2); border: 1px dashed var(--border); }
.prob-answer .ans-label { color: var(--ok); font-weight: 700; margin-right: 6px; }
.prob-video-wrap { position: relative; width: 100%; aspect-ratio: 16/9; margin-bottom: 18px; border-radius: 10px; overflow: hidden; background:#000; }
.prob-video-wrap iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
.prob-score { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--border);
  padding: 10px 14px; font-size: .9rem; text-align: center; border-radius: 10px; margin-top: 8px; }

/* 내용 섹션 */
.section { padding: 6px 0 10px; border-radius: 10px; transition: background .25s ease; scroll-margin-top: 14px; }
.section .sec-time {
  display: inline-block; font-size: .72rem; color: var(--accent);
  border: 1px solid var(--accent-dim); border-radius: 6px; padding: 0 6px; margin-bottom: 6px; cursor: pointer;
}
.section h3 { margin: 4px 0 8px; font-size: 1.12rem; }
.section.active { background: var(--hl); box-shadow: inset 3px 0 0 var(--hl-border); padding-left: 12px; }
.content h2.doc-title { font-size: 1.3rem; margin: 0 0 4px; }
.content .doc-sub { color: var(--muted); margin: 0 0 20px; font-size: .9rem; }
.content ul, .content ol { padding-left: 22px; }
.content table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: .92rem; }
.content th, .content td { border: 1px solid var(--border); padding: 6px 9px; text-align: left; }
.content th { background: var(--panel-2); }
.katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }

.est-note {
  font-size: .8rem; color: var(--warn); background: rgba(242,178,76,.08);
  border: 1px solid rgba(242,178,76,.3); border-radius: 8px; padding: 8px 12px; margin-bottom: 18px;
}

/* 재개 팝업(토스트) */
.resume-popup {
  position: absolute; right: 18px; bottom: 18px; z-index: 20;
  background: var(--panel); border: 1px solid var(--accent); border-radius: 12px;
  padding: 14px 16px; width: min(300px, 82%); box-shadow: 0 8px 30px rgba(0,0,0,.5);
  animation: pop .18s ease;
}
@keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.popup-text { font-size: .9rem; margin-bottom: 10px; }
.popup-actions { display: flex; gap: 8px; }
.btn { border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
  padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: .85rem; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #041016; font-weight: 600; }
.btn-ghost { background: transparent; }
.btn:hover { filter: brightness(1.08); }

/* 재활성 버튼 */
.reenable-btn {
  position: absolute; right: 18px; bottom: 18px; z-index: 15;
  background: var(--accent); color: #041016; border: none; font-weight: 600;
  padding: 10px 16px; border-radius: 999px; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.45);
}
.reenable-btn:hover { filter: brightness(1.08); }

.hidden { display: none !important; }

</style>
</head>

    section.className = 'lecture-group';
    const h2 = document.createElement('h2');
    h2.textContent = group.name;
    section.appendChild(h2);

    const grid = document.createElement('div');
    grid.className = 'card-grid';

    (group.lectures || []).forEach(lec => {
      const card = document.createElement(lec.ready ? 'a' : 'div');
      card.className = 'lec-card' + (lec.ready ? '' : ' disabled');
      if (lec.ready) card.href = window.__STANDALONE__ ? (lec.id + '.html') : ('viewer.html?id=' + encodeURIComponent(lec.id));

      card.innerHTML =
        '<div class="lec-no">' + lec.no + '</div>' +
        '<div class="lec-title">' + lec.title + '</div>' +
        '<div class="lec-meta">' +
          '<span>' + (lec.textbook || '') + '</span>' +
          '<span>' + (lec.duration || '') + '</span>' +
        '</div>' +
        (lec.ready ? '<div class="lec-badge ready">열람 가능</div>'
                   : '<div class="lec-badge">준비중</div>');
      grid.appendChild(card);
    });

    section.appendChild(grid);
    listEl.appendChild(section);
  });
})();
</script>
</body>
</html>
