<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 880" class="lrn lrn-1-types" role="img" aria-labelledby="lrn-1-types-m-t lrn-1-types-m-d"><title id="lrn-1-types-m-t">위스키 종류 한눈에: 위스키 이름은 어디서, 무엇으로, 어떤 방식으로 만들었는지에 따라 정해진다.</title><desc id="lrn-1-types-m-d">네 칸 그림. 스코틀랜드: 물 + 맥아 보리를 단식 증류기로 한 증류소에서 만들면 싱글몰트, 여러 증류소의 싱글몰트를 섞으면 블렌디드 몰트, 연속식 증류기(대체로)로 만들면 그레인, 싱글몰트 + 그레인은 블렌디드. 오크통에서 3년 이상 · 40% 이상. 미국: 옥수수 51% 이상이면 버번, 호밀 51% 이상이면 라이. 새로 그을린 오크통 · 40% 이상. 아일랜드: 맥아 보리 + 맥아 아닌 보리를 단식 증류기로 만드는 싱글 팟 스틸, 아일랜드 고유 방식. 일본: 재패니즈, 업계 자율 기준(2021~).</desc><style>.lrn-1-types{color:var(--ink,#14201a);font-family:inherit;--lrn-ac:var(--accent,#1e5a43);--lrn-ai:var(--accent-ink,#fff)}@media(prefers-color-scheme:dark){.lrn-1-types{color:var(--ink,#e8eee9);--lrn-ac:var(--accent,#74c7a3);--lrn-ai:var(--accent-ink,#0f1613)}}.lrn-1-types .lrn-o{stroke:currentColor;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}.lrn-1-types .lrn-l{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;vector-effect:non-scaling-stroke}.lrn-1-types .lrn-a{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.lrn-1-types .lrn-ac{stroke:var(--lrn-ac);stroke-width:2.6}.lrn-1-types .lrn-acf{fill:var(--lrn-ac)}.lrn-1-types .lrn-dd{stroke-dasharray:5 4}.lrn-1-types .lrn-sm{fill:none;stroke:var(--muted,#7a8a80);stroke-width:2;stroke-dasharray:2 4;stroke-linecap:round;vector-effect:non-scaling-stroke}.lrn-1-types .lrn-band{fill:var(--lrn-ac)}.lrn-1-types .lrn-nb{fill:currentColor;fill-opacity:.07;stroke:currentColor;stroke-opacity:.35;stroke-width:1.2}.lrn-1-types .lrn-pn{fill:currentColor;fill-opacity:.035;stroke:currentColor;stroke-opacity:.25;stroke-width:1.2}.lrn-1-types .lrn-hl{fill:none;stroke:#fff;stroke-opacity:.55;stroke-width:3;stroke-linecap:round}.lrn-1-types text{fill:currentColor;font-size:14px}.lrn-1-types .lrn-m{fill:var(--muted,#7a8a80)}.lrn-1-types .lrn-bx{font-size:16px;font-weight:700}.lrn-1-types .lrn-hd{font-size:16px;font-weight:700}.lrn-1-types .lrn-bt{fill:var(--lrn-ai);font-size:15px;font-weight:700}.lrn-1-types .lrn-nt{fill:var(--lrn-ai);font-size:13px;font-weight:700}.lrn-1-types .lrn-big{font-size:30px;font-weight:900;fill:#2a1806}</style><defs><marker id="lrn-1-types-m-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker><marker id="lrn-1-types-m-hc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="lrn-acf"/></marker></defs><g transform="translate(0 0)"><rect class="lrn-pn" x="3" y="2" width="354" height="310" rx="12"/><rect class="lrn-band" x="8" y="6" width="344" height="26" rx="8"/><text class="lrn-bt" x="180" y="24.5" text-anchor="middle">스코틀랜드</text><g transform="translate(52 74) scale(0.95)"><path class="lrn-l" d="M0,30Q2,4 0,-26"/><ellipse class="lrn-o" style="fill:#e2b866;stroke-width:1.6" cx="-4.4" cy="14" rx="3.8" ry="6.4" transform="rotate(-24 -4.4 14)"/><path class="lrn-l" style="stroke-width:1.2" d="M-6.4,8.6l-4,-9"/><ellipse class="lrn-o" style="fill:#e2b866;stroke-width:1.6" cx="4.4" cy="14" rx="3.8" ry="6.4" transform="rotate(24 4.4 14)"/><path class="lrn-l" style="stroke-width:1.2" d="M6.4,8.6l4,-9"/><ellipse class="lrn-o" style="fill:#e2b866;stroke-width:1.6" cx="-4.4" cy="6" rx="3.8" ry="6.4" transform="rotate(-24 -4.4 6)"/><path class="lrn-l" style="stroke-width:1.2" d="M-6.4,0.6l-4,-9"/><ellipse class="lrn-o" style="fill:#e2b866;stroke-width:1.6" cx="4.4" cy="6" rx="3.8" ry="6.4" transform="rotate(24 4.4 6)"/><path class="lrn-l" style="stroke-width:1.2" d="M6.4,0.6l4,-9"/><ellipse class="lrn-o" style="fill:#e2b866;stroke-width:1.6" cx="-4.4" cy="-2" rx="3.8" ry="6.4" transform="rotate(-24 -4.4 -2)"/><path class="lrn-l" style="stroke-width:1.2" d="M-6.4,-7.4l-4,-9"/><ellipse class="lrn-o" style="fill:#e2b866;stroke-width:1.6" cx="4.4" cy="-2" r