<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 880" class="lrn lrn-3-cask" role="img" aria-labelledby="lrn-3-cask-m-t lrn-3-cask-m-d"><title id="lrn-3-cask-m-t">통에서 보내는 시간: 어떤 통에서 얼마나 오래 두었는지가 라벨의 숫자와 낱말로 적힌다.</title><desc id="lrn-3-cask-m-d">위 단 &#x27;어떤 통에서&#x27;: 새 오크통(안쪽을 불로 그을림, 버번은 새 통만)에서 버번통(한 번 쓴 버번통을 다른 위스키에)으로 화살표, 셰리통(셰리 와인을 담았던 통), 피니시(마지막에 다른 통으로 옮겨 더 숙성). 스카치는 700리터 이하 오크통. 아래 단 &#x27;얼마나 오래&#x27;: 시간 줄 위에 10년, 12년, 15년 (예시) 원액 통이 있고 모두 병 하나로 모인다. 시간 줄에는 3년(스카치 최소) 눈금이 있다. 병 라벨에는 가장 어린 10이 강조된다. 라벨 숫자는 가장 어린 원액 기준. 숫자가 없으면 NAS(숙성년수 미표기).</desc><style>.lrn-3-cask{color:var(--ink,#14201a);font-family:inherit;--lrn-ac:var(--accent,#1e5a43);--lrn-ai:var(--accent-ink,#fff)}@media(prefers-color-scheme:dark){.lrn-3-cask{color:var(--ink,#e8eee9);--lrn-ac:var(--accent,#74c7a3);--lrn-ai:var(--accent-ink,#0f1613)}}.lrn-3-cask .lrn-o{stroke:currentColor;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}.lrn-3-cask .lrn-l{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;vector-effect:non-scaling-stroke}.lrn-3-cask .lrn-a{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.lrn-3-cask .lrn-ac{stroke:var(--lrn-ac);stroke-width:2.6}.lrn-3-cask .lrn-acf{fill:var(--lrn-ac)}.lrn-3-cask .lrn-dd{stroke-dasharray:5 4}.lrn-3-cask .lrn-sm{fill:none;stroke:var(--muted,#7a8a80);stroke-width:2;stroke-dasharray:2 4;stroke-linecap:round;vector-effect:non-scaling-stroke}.lrn-3-cask .lrn-band{fill:var(--lrn-ac)}.lrn-3-cask .lrn-nb{fill:currentColor;fill-opacity:.07;stroke:currentColor;stroke-opacity:.35;stroke-width:1.2}.lrn-3-cask .lrn-pn{fill:currentColor;fill-opacity:.035;stroke:currentColor;stroke-opacity:.25;stroke-width:1.2}.lrn-3-cask .lrn-hl{fill:none;stroke:#fff;stroke-opacity:.55;stroke-width:3;stroke-linecap:round}.lrn-3-cask text{fill:currentColor;font-size:14px}.lrn-3-cask .lrn-m{fill:var(--muted,#7a8a80)}.lrn-3-cask .lrn-bx{font-size:16px;font-weight:700}.lrn-3-cask .lrn-hd{font-size:16px;font-weight:700}.lrn-3-cask .lrn-bt{fill:var(--lrn-ai);font-size:15px;font-weight:700}.lrn-3-cask .lrn-nt{fill:var(--lrn-ai);font-size:13px;font-weight:700}.lrn-3-cask .lrn-big{font-size:30px;font-weight:900;fill:#2a1806}</style><defs><marker id="lrn-3-cask-m-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker><marker id="lrn-3-cask-m-hc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="lrn-acf"/></marker></defs><rect class="lrn-band" x="8" y="10" width="6" height="22" rx="3"/><text class="lrn-hd" x="22" y="27">어떤 통에서</text><g transform="translate(74 88) scale(0.85)"><path class="lrn-o" d="M-49.9,-29Q0,-36 49.9,-29Q63.7,0 49.9,29Q0,36 -49.9,29Q-63.7,0 -49.9,-29Z" style="fill:#b07a45"/><path class="lrn-l" style="stroke-opacity:.35" d="M-37.7,-13.1Q0,-15 49.9,-13.1"/><path class="lrn-l" style="stroke-opacity:.35" d="M-37.7,13.1Q0,15 49.9,13.1"/><path class="lrn-l" style="stroke-width:2.4" d="M-23.2,-34.6Q-19.2,0 -23.2,34.6"/><path class="lrn-l" style="stroke-width:2.4" d="M34.8,-34.6Q38.8,0 34.8,34.6"/><ellipse class="lrn-o" style="fill:#c99560" cx="-50.7" cy="0" rx="13" ry="27.8"/><ellipse cx="-50.7" cy="0" rx="8.1" ry="19.7" fill="#2a1a10"/><g transform="translate(-50.7 5.8)"><path class="lrn-o" style="fill:#f08a24;stroke-width:2" d="M0,-12.0C6.0,-4.5 9.0,1.5 6.0,7.5Q0,13.5 -6.0,7.5C-9.0,1.5 -4.5,-3.0 0,-12.0Z"/><path d="M0,-3.0C3.0,0.75 3.75,4.5 1.5,7.5Q0,9.0 -1.5,7.5C-3.75,4.5 -2.25,0.75 0,-3.0Z" fill="#f7c948"/></g></g><text class="lrn-hd" x="150" y="76">새 오크통</text><text class="lrn-t" x="150" y="98">안쪽을 불로 그을림</text><text class="lrn-t" x="150" y="116">버번은 새 통만</text><path class="lrn-a" d="M74,120V146" marker-end="url(#lrn-3-cask-m-h)"/><g transform="translate(74 184) scale(0.85)"><path class="lrn-o" d="M-49.9,-29Q0,-36 49.9,-29Q63.7,0 49.9,29Q0,36 -