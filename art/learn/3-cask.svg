36.1,-22Q46.1,0 36.1,22Q0,27.3 -36.1,22Q-46.1,0 -36.1,-22Z" style="fill:#b07a45"/><path class="lrn-l" style="stroke-opacity:.35" d="M-27.3,-9.9Q0,-11.4 36.1,-9.9"/><path class="lrn-l" style="stroke-opacity:.35" d="M-27.3,9.9Q0,11.4 36.1,9.9"/><path class="lrn-l" style="stroke-width:2.4" d="M-16.8,-26.2Q-12.8,0 -16.8,26.2"/><path class="lrn-l" style="stroke-width:2.4" d="M25.2,-26.2Q29.2,0 25.2,26.2"/><ellipse class="lrn-o" style="fill:#c99560" cx="-36.7" cy="0" rx="9.4" ry="21.1"/></g><text class="lrn-hd" x="630" y="146" text-anchor="middle">피니시</text><text class="lrn-t" x="630" y="168" text-anchor="middle">마지막에 다른 통으로</text><text class="lrn-t" x="630" y="186" text-anchor="middle">옮겨 더 숙성</text><path class="lrn-a" d="M160,84H208" marker-end="url(#lrn-3-cask-h)"/><path class="lrn-a" d="M520,84H578" marker-end="url(#lrn-3-cask-h)"/><rect class="lrn-nb" x="220" y="206" width="280" height="26" rx="8"/><text class="lrn-t" x="360" y="224" text-anchor="middle">스카치는 700리터 이하 오크통</text><path class="lrn-l" style="stroke-opacity:.25;stroke-dasharray:4 5" d="M8,244H712"/><rect class="lrn-band" x="8" y="258" width="6" height="22" rx="3"/><text class="lrn-hd" x="22" y="275">얼마나 오래</text><text class="lrn-t lrn-m" x="22" y="297">(예시)</text><path class="lrn-a" d="M40,426H506" marker-end="url(#lrn-3-cask-h)"/><path class="lrn-l" style="stroke-opacity:.45" d="M40,422V430"/><path class="lrn-l" style="stroke-opacity:.45" d="M68.8,422V430"/><path class="lrn-l" style="stroke-opacity:.45" d="M97.5,422V430"/><path class="lrn-l" style="stroke-opacity:.45" d="M126.2,422V430"/><path class="lrn-l" style="stroke-opacity:.45" d="M155,422V430"/><path class="lrn-l" style="stroke-opacity:.45" d="M183.8,422V430"/><path class="lrn-l" style="stroke-opacity:.45" d="M212.5,422V430"/><path class="lrn-l" style="stroke-opacity:.45" d="M241.2,422V430"/><path class="lrn-l" style="stroke-opacity:.45" d="M270,422V430"/><path class="lrn-l" style="stroke-opacity:.45" d="M298.8,422V430"/><path class="lrn-l" style=