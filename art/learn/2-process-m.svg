<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 880" class="lrn lrn-2-process" role="img" aria-labelledby="lrn-2-process-m-t lrn-2-process-m-d"><title id="lrn-2-process-m-t">위스키가 만들어지는 길: 몰트위스키는 보리에서 병까지 여섯 단계를 거친다.</title><desc id="lrn-2-process-m-d">여섯 단계가 순서대로 이어진다. 1 맥아 만들기: 보리를 싹 틔워 말린다. 갈래로 피트 연기로 말리기(선택). 2 당화: 뜨거운 물에 담가 당을 뽑는다, 보리 자신의 효소로. 3 발효: 효모를 넣어 알코올을 만든다. 4 증류: 단식 증류기로 대체로 두 번, 94.8% 미만으로 증류. 5 숙성: 오크통, 스카치는 3년 이상. 6 병입: 물로 도수를 맞춘다, 40% 이상. 말풍선: 캐스크 스트렝스는 물을 거의 타지 않는다. 액체 색은 당화·발효에서 옅은 곡물색, 증류 직후 거의 투명, 숙성 뒤 호박색이다.</desc><style>.lrn-2-process{color:var(--ink,#14201a);font-family:inherit;--lrn-ac:var(--accent,#1e5a43);--lrn-ai:var(--accent-ink,#fff)}@media(prefers-color-scheme:dark){.lrn-2-process{color:var(--ink,#e8eee9);--lrn-ac:var(--accent,#74c7a3);--lrn-ai:var(--accent-ink,#0f1613)}}.lrn-2-process .lrn-o{stroke:currentColor;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}.lrn-2-process .lrn-l{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;vector-effect:non-scaling-stroke}.lrn-2-process .lrn-a{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.lrn-2-process .lrn-ac{stroke:var(--lrn-ac);stroke-width:2.6}.lrn-2-process .lrn-acf{fill:var(--lrn-ac)}.lrn-2-process .lrn-dd{stroke-dasharray:5 4}.lrn-2-process .lrn-sm{fill:none;stroke:var(--muted,#7a8a80);stroke-width:2;stroke-dasharray:2 4;stroke-linecap:round;vector-effect:non-scaling-stroke}.lrn-2-process .lrn-band{fill:var(--lrn-ac)}.lrn-2-process .lrn-nb{fill:currentColor;fill-opacity:.07;stroke:currentColor;stroke-opacity:.35;stroke-width:1.2}.lrn-2-process .lrn-pn{fill:currentColor;fill-opacity:.035;stroke:currentColor;stroke-opacity:.25;stroke-width:1.2}.lrn-2-process .lrn-hl{fill:none;stroke:#fff;stroke-opacity:.55;stroke-width:3;stroke-linecap:round}.lrn-2-process text{fill:currentColor;font-size:14px}.lrn-2-process .lrn-m{fill:var(--muted,#7a8a80)}.lrn-2-process .lrn-bx{font-size:16px;font-weight:700}.lrn-2-process .lrn-hd{font-size:16px;font-weight:700}.lrn-2-process .lrn-bt{fill:var(--lrn-ai);font-size:15px;font-weight:700}.lrn-2-process .lrn-nt{fill:var(--lrn-ai);font-size:13px;font-weight:700}.lrn-2-process .lrn-big{font-size:30px;font-weight:900;fill:#2a1806}</style><defs><marker id="lrn-2-process-m-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker><marker id="lrn-2-process-m-hc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="lrn-acf"/></marker></defs><rect class="lrn-pn" x="40" y="3" width="316" height="142" rx="12"/><circle class="lrn-band" cx="20" cy="22" r="12"/><text class="lrn-nt" x="20" y="27" text-anchor="middle">1</text><path class="lrn-a" d="M20,38V154" marker-end="url(#lrn-2-process-m-h)"/><text class="lrn-hd" x="54" y="28">맥아 만들기</text><g transform="translate(66 74) scale(0.81)"><path class="lrn-l" style="stroke:#5e9e4a;stroke-width:2.6" d="M3,-10q2,-14 12,-20"/><path class="lrn-o" style="fill:#5e9e4a;stroke-width:1.6" d="M15,-30q8,-2 10,4q-7,3 -10,-4z"/><ellipse class="lrn-o" style="fill:#e2b866" cx="0" cy="4" rx="9" ry="15" transform="rotate(18 0 4)"/><path class="lrn-l" d="M-5,18q-5,7 -12,6M-2,19q-1,8 -6,12M-6,15q-8,2 -12,-2" style="stroke-width:1.4"/><path class="lrn-l" style="stroke-opacity:.5" d="M-1,-8q-3,12 1,24"/></g><g transform="translate(118 78) scale(0.81)"><path class="lrn-o" d="M-34,4H34L30,12H-30Z" style="fill:#9a9a9a"/><ellipse class="lrn-o" style="fill:#e2b866;stroke-width:1.5" cx="-26" cy="-1" rx="4" ry="6" transform="rotate(-20 -26 -1)"/><path class="lrn-l" style="stroke:#5e9e4a;stroke-width:1.8" d="M-25,-7q2,-6 6,-8"/><ellipse class="lrn-o" style="fill:#e2b866;stroke-width:1.5" cx="-17" cy="-1" rx="4" ry="6" transform="rotate(0 -17 -1)"/><ellipse class="lrn-o" style="fill:#e2b866;stroke-width:1.5" cx="-8" cy="-1" rx="4