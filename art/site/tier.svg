<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 192" class="mth mth-tier" role="img" aria-labelledby="mth-tier-t mth-tier-d"><title id="mth-tier-t">티어 비율과 확신도: 점수 상위부터 5·15·25·25·20·10%로 나누고, 출처 수와 오차 범위로 잠정·경계·확정을 표시한다.</title><desc id="mth-tier-d">티어는 점수 상위부터 S 5%, A 15%, B 25%, C 25%, D 20%, E 10% 비율로 나눈다. 옛 병은 경계 계산에서 빼고, 자기 점수로 티어만 정한다. 확신도: 독립 출처 1곳이면 잠정, 점수 ± 표준오차가 티어 경계를 넘으면 경계, 경계 안이면 확정.</desc><style>.mth-tier{color:var(--ink,#14201a);font-family:inherit;--mth-ac:var(--accent,#1e5a43);--mth-ai:var(--accent-ink,#fff)}@media(prefers-color-scheme:dark){.mth-tier{color:var(--ink,#e8eee9);--mth-ac:var(--accent,#74c7a3);--mth-ai:var(--accent-ink,#0f1613)}}.mth-tier .mth-o{stroke:currentColor;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}.mth-tier .mth-l{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}.mth-tier .mth-a{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.mth-tier .mth-ac{stroke:var(--mth-ac);stroke-width:2.4}.mth-tier .mth-acf{fill:var(--mth-ac)}.mth-tier .mth-dd{stroke-dasharray:4 4}.mth-tier .mth-mu{stroke:var(--muted,#7a8a80)}.mth-tier .mth-card{fill:var(--surface,#f8faf6);stroke:currentColor;stroke-opacity:.45;stroke-width:1.3}.mth-tier .mth-nb{fill:currentColor;fill-opacity:.06;stroke:currentColor;stroke-opacity:.35;stroke-width:1.2}.mth-tier text{fill:currentColor;font-size:14.5px}.mth-tier .mth-m{fill:var(--muted,#7a8a80)}.mth-tier .mth-b{font-weight:700}.mth-tier .mth-s{font-size:13.5px}.mth-tier .mth-big{font-size:22px;font-weight:900}</style><defs><marker id="mth-tier-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker><marker id="mth-tier-hc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mth-acf"/></marker><marker id="mth-tier-hm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--muted,#7a8a80)"/></marker></defs><text class="mth-b mth-s" x="4" y="16">점수 상위부터</text><path class="mth-a" d="M100,11H130" marker-end="url(#mth-tier-h)"/><rect x="4" y="22" width="19.6" height="24" style="fill:#5a1a12"/><text class="mth-b" x="13.8" y="39" text-anchor="middle" style="fill:#fff7ea">S</text><text class="mth-s" x="13.8" y="62" text-anchor="middle">5%</text><rect x="23.6" y="22" width="58.8" height="24" style="fill:#8a3414"/><text class="mth-b" x="53" y="39" text-anchor="middle" style="fill:#fff7ea">A</text><text class="mth-s" x="53" y="62" text-anchor="middle">15%</text><rect x="82.4" y="22" width="98" height="24" style="fill:#b85c16"/><text class="mth-b" x="131.4" y="39" text-anchor="middle" style="fill:#fff7ea">B</text><text class="mth-s" x="131.4" y="62" text-anchor="middle">25%</text><rect x="180.4" y="22" width="98" height="24" style="fill:#d98a1f"/><text class="mth-b" x="229.4" y="39" text-anchor="middle" style="fill:#231603">C</text><text class="mth-s" x="229.4" y="62" text-anchor="middle">25%</text><rect x="278.4" y="22" width="78.4" height="24" style="fill:#e9b949"/><text class="mth-b" x="317.6" y="39" text-anchor="middle" style="fill:#231603">D</text><text class="mth-s" x="317.6" y="62" text-anchor="middle">20%</text><rect x="356.8" y="22" width="39.2" height="24" style="fill:#f0dc8c"/><text class="mth-b" x="376.4" y="39" text-anchor="middle" style="fill:#231603">E</text><text class="mth-s" x="376.4" y="62" text-anchor="middle">10%</text><rect x="4" y="22" width="392" height="24" rx="4" style="fill:none;stroke:currentColor;stroke-width:1.6"/><g transform="translate(14 82)"><circle class="mth-o" style="fill:#fbf6ea;stroke-width:1.6" r="9"/><path d="M0,-5V0L4,2" stroke="#2a1806" stroke-width="1.6" stroke-linecap="round" fill="none"/></g><text class="mth-b mth-s" x="30" y="87">옛 병</text><text class="mth-s mth-m" x="70" y="87">경계 계산에서 빼고, 자기 점수로 티어만 정함</text><path class="mth-l" style="stroke-opacity:.25;stroke-dasharray:3 4" d="M4,98H396"/><text class="mth-b mth-s" x="4" y="116">확신도</text><path class="mth-l" style="stroke-dasharray:3 3" d="M316,122V188"/><text class="mth-s mth-m" x="310" y="116" text-anchor="end">티어 경계</text><text class="mth-b" x="4" y="141">잠정</text><text class="mth-s" x="44" y="141">독립 출처 1곳</text><path class="mth-l" style="stroke-opacity:.3" d="M250,136H392"/><circle class="mth-o" style="fill:var(--surface,#f8faf6);stroke-width:1.6;stroke-dasharray:2 2" cx="280" cy="136" r="5"/><text class="mth-b" x="4" y="163">경계</text><text class="mth-s" x="44" y="163">점수 ± 표준오차가 경계를 넘음</text><path class="mth-l" style="stroke-opacity:.3" d="M250,158H392"/><path class="mth-l" style="stroke-width:2.4;stroke:#c9822b" d="M270,158H330M270,153v10M330,153v10"/><circle class="mth-o" style="fill:#c9822b;stroke-width:1.6" cx="300" cy="158" r="5"/><text class="mth-b" x="4" y="185">확정</text><text class="mth-s" x="44" y="185">경계 안</text><path class="mth-l" style="stroke-opacity:.3" d="M250,180H392"/><path class="mth-l" style="stroke-width:2.4;stroke:#c9822b" d="M252,180H288M252,175v10M288,175v10"/><circle class="mth-o" style="fill:#c9822b;stroke-width:1.6" cx="270" cy="180" r="5"/></svg>
