<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" class="mth mth-score" role="img" aria-labelledby="mth-score-t mth-score-d"><title id="mth-score-t">점수 산출 방식: 출처를 100점 척도로 맞추고, 같은 매체는 한 표로 묶어 종류별 사전 평균과 함께 나눈다.</title><desc id="mth-score-d">출처 형식별로 100점 척도로 맞춘다: 점수표·평점은 그대로, 메타 평점은 선형 변환, 순위 리스트는 고르게 폄. 추천 목록은 점수에 넣지 않고 매체 추천 N회로만 표시. 같은 매체의 여러 리스트는 한 표로 묶는다. 종합 점수 = (매체 그룹별 점수의 합 + 종류별 사전 평균) ÷ (독립 출처 수 + 1).</desc><style>.mth-score{color:var(--ink,#14201a);font-family:inherit;--mth-ac:var(--accent,#1e5a43);--mth-ai:var(--accent-ink,#fff)}@media(prefers-color-scheme:dark){.mth-score{color:var(--ink,#e8eee9);--mth-ac:var(--accent,#74c7a3);--mth-ai:var(--accent-ink,#0f1613)}}.mth-score .mth-o{stroke:currentColor;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}.mth-score .mth-l{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}.mth-score .mth-a{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.mth-score .mth-ac{stroke:var(--mth-ac);stroke-width:2.4}.mth-score .mth-acf{fill:var(--mth-ac)}.mth-score .mth-dd{stroke-dasharray:4 4}.mth-score .mth-mu{stroke:var(--muted,#7a8a80)}.mth-score .mth-card{fill:var(--surface,#f8faf6);stroke:currentColor;stroke-opacity:.45;stroke-width:1.3}.mth-score .mth-nb{fill:currentColor;fill-opacity:.06;stroke:currentColor;stroke-opacity:.35;stroke-width:1.2}.mth-score text{fill:currentColor;font-size:14.5px}.mth-score .mth-m{fill:var(--muted,#7a8a80)}.mth-score .mth-b{font-weight:700}.mth-score .mth-s{font-size:13.5px}.mth-score .mth-big{font-size:22px;font-weight:900}</style><defs><marker id="mth-score-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker><marker id="mth-score-hc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mth-acf"/></marker><marker id="mth-score-hm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--muted,#7a8a80)"/></marker></defs><text class="mth-b mth-s" x="68" y="14" text-anchor="middle">출처</text><rect class="mth-card" x="4" y="23" width="128" height="26" rx="8"/><g transform="translate(21 36)"><rect class="mth-o" style="fill:#fbf6ea;stroke-width:1.6" x="-8" y="-10" width="16" height="20" rx="2"/><path d="M0,-6l1.8,3.6 4,.6-2.9,2.8.7,4L0,3.1-3.6,5l.7-4-2.9-2.8 4-.6z" fill="#e0a526" stroke="currentColor" stroke-width=".8"/></g><text x="38" y="41">점수표·평점</text><text class="mth-s mth-m" x="196" y="31" text-anchor="middle">그대로</text><path class="mth-a" d="M136,36H256" marker-end="url(#mth-score-h)"/><rect class="mth-card" x="4" y="55" width="128" height="26" rx="8"/><g transform="translate(21 68)"><rect class="mth-o" style="fill:#fbf6ea;stroke-width:1.6" x="-9" y="-10" width="18" height="20" rx="2"/><path d="M-5,6V1M-1,6V-4M3,6V-1" stroke="#c9822b" stroke-width="3" stroke-linecap="round"/></g><text x="38" y="73">메타 평점</text><text class="mth-s mth-m" x="196" y="63" text-anchor="middle">선형 변환</text><path class="mth-a" d="M136,68H256" marker-end="url(#mth-score-h)"/><rect class="mth-card" x="4" y="87" width="128" height="26" rx="8"/><g transform="translate(21 100)"><rect class="mth-o" style="fill:#fbf6ea;stroke-width:1.6" x="-8" y="-10" width="16" height="20" rx="2"/><text x="-4.5" y="-2.5" text-anchor="middle" style="font-size:6.5px;font-weight:700;fill:#2a1806">1</text><path d="M-1,-5H5" stroke="#2a1806" stroke-width="1.4" stroke-linecap="round"/><text x="-4.5" y="2.5" text-anchor="middle" style="font-size:6.5px;font-weight:700;fill:#2a1806">2</text><path d="M-1,0H5" stroke="#2a1806" stroke-width="1.4" stroke-linecap="round"/><text x="-4.5" y="7.5" text-anchor="middle" style="font-size:6.5px;font-weight:700;fill:#2a1806">3</text><path d="M-1,5H5" stroke="#2a1806" stroke-width="1.4" stroke-linecap="round"/></g><text x="38" y="105">순위 리스트</text><text class="mth-s mth-m" x="196" y="95" text-anchor="middle">고르게 폄</text><path class="mth-a" d="M136,100H256" marker-end="url(#mth-score-h)"/><rect class="mth-o" style="fill:#fbf6ea" x="262" y="22" width="20" height="92" rx="5"/><rect x="263.2" y="31" width="17.6" height="81.8" rx="4" style="fill:#c9822b;fill-opacity:.7"/><path class="mth-l" style="stroke-width:1.2" d="M282,26h5"/><path class="mth-l" style="stroke-width:1.2" d="M282,43.2h5"/><path class="mth-l" style="stroke-width:1.2" d="M282,60.4h5"/><path class="mth-l" style="stroke-width:1.2" d="M282,77.6h5"/><path class="mth-l" style="stroke-width:1.2" d="M282,94.8h5"/><path class="mth-l" style="stroke-width:1.2" d="M282,112h5"/><text class="mth-b mth-s" x="272" y="14" text-anchor="middle">100점 척도</text><rect class="mth-card" x="4" y="123" width="128" height="26" rx="8" style="stroke-dasharray:4 3"/><g transform="translate(21 136)"><rect class="mth-o" style="fill:#fbf6ea;stroke-width:1.6" x="-8" y="-10" width="16" height="20" rx="2"/><circle cx="-4" cy="-5" r="1.4" fill="#2a1806"/><path d="M-1,-5H5" stroke="#2a1806" stroke-width="1.4" stroke-linecap="round"/><circle cx="-4" cy="0" r="1.4" fill="#2a1806"/><path d="M-1,0H5" stroke="#2a1806" stroke-width="1.4" stroke-linecap="round"/><circle cx="-4" cy="5" r="1.4" fill="#2a1806"/><path d="M-1,5H5" stroke="#2a1806" stroke-width="1.4" stroke-linecap="round"/></g><text x="38" y="141">추천 목록</text><path class="mth-a mth-dd mth-mu" d="M136,136H152" marker-end="url(#mth-score-hm)"/><text class="mth-s" x="158" y="134">매체 추천 N회</text><text class="mth-s mth-m" x="158" y="151">점수에 넣지 않음</text><rect class="mth-card" x="300" y="26" width="40" height="30" rx="5"/><g transform="translate(320 41) scale(0.8)"><rect class="mth-o" style="fill:#fbf6ea;stroke-width:1.6" x="-8" y="-10" width="16" height="20" rx="2"/><text x="-4.5" y="-2.5" text-anchor="middle" style="font-size:6.5px;font-weight:700;fill:#2a1806">1</text><path d="M-1,-5H5" stroke="#2a1806" stroke-width="1.4" stroke-linecap="round"/><text x="-4.5" y="2.5" text-anchor="middle" style="font-size:6.5px;font-weight:700;fill:#2a1806">2</text><path d="M-1,0H5" stroke="#2a1806" stroke-width="1.4" stroke-linecap="round"/><text x="-4.5" y="7.5" text-anchor="middle" style="font-size:6.5px;font-weight:700;fill:#2a1806">3</text><path d="M-1,5H5" stroke="#2a1806" stroke-width="1.4" stroke-linecap="round"/></g><rect class="mth-card" x="308" y="34" width="40" height="30" rx="5"/><g transform="translate(328 49) scale(0.8)"><rect class="mth-o" style="fill:#fbf6ea;stroke-width:1.6" x="-8" y="-10" width="16" height="20" rx="2"/><text x="-4.5" y="-2.5" text-anchor="middle" style="font-size:6.5px;font-weight:700;fill:#2a1806">1</text><path d="M-1,-5H5" stroke="#2a1806" stroke-width="1.4" stroke-linecap="round"/><text x="-4.5" y="2.5" text-anchor="middle" style="font-size:6.5px;font-weight:700;fill:#2a1806">2</text><path d="M-1,0H5" stroke="#2a1806" stroke-width="1.4" stroke-linecap="round"/><text x="-4.5" y="7.5" text-anchor="middle" style="font-size:6.5px;font-weight:700;fill:#2a1806">3</text><path d="M-1,5H5" stroke="#2a1806" stroke-width="1.4" stroke-linecap="round"/></g><path class="mth-l" d="M352,30q8,0 8,8v14q0,8 6,8q-6,0 -6,8"/><circle class="mth-o" style="fill:#c9822b" cx="380" cy="60" r="11"/><text class="mth-b" x="380" y="65" text-anchor="middle" style="fill:#2a1806">1</text><text class="mth-s" x="348" y="92" text-anchor="middle">같은 매체는</text><text class="mth-b mth-s" x="348" y="109" text-anchor="middle">한 표</text><path class="mth-a" d="M272,118V150" marker-end="url(#mth-score-h)"/><path class="mth-a" d="M348,116V150" marker-end="url(#mth-score-h)"/><rect class="mth-nb" x="4" y="154" width="392" height="54" rx="10"/><text class="mth-b" x="14" y="186">종합 점수 =</text><text class="mth-s" x="252" y="175" text-anchor="middle">매체 그룹별 점수의 합 + 종류별 사전 평균</text><path class="mth-l" style="stroke-width:1.8" d="M110,181H394"/><text class="mth-s" x="252" y="199" text-anchor="middle">독립 출처 수 + 1</text></svg>
