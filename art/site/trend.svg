<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 356" class="mth mth-trend" role="img" aria-labelledby="mth-trend-t mth-trend-d"><title id="mth-trend-t">트렌드지수: 세 재료를 비중대로 가중 평균한 0~100 누적 인지도이며, 티어 점수와는 별개다.</title><desc id="mth-trend-d">트렌드지수 재료와 비중(합 100): 데일리샷 리뷰 수 70, 위키백과 조회수 18, 해외 출처 등장 횟수 12. 데일리샷 리뷰 수는 국내 점수, 나머지는 해외 점수. 재료별 부분 점수(0~100)의 가중 평균이 0~100 트렌드지수(누적 인지도)가 된다. 티어·종합 점수·확신도 계산에는 넣지 않는다. 게이지 바늘 위치는 예시다.</desc><style>.mth-trend{color:var(--ink,#14201a);font-family:inherit;--mth-ac:var(--accent,#1e5a43);--mth-ai:var(--accent-ink,#fff)}@media(prefers-color-scheme:dark){.mth-trend{color:var(--ink,#e8eee9);--mth-ac:var(--accent,#74c7a3);--mth-ai:var(--accent-ink,#0f1613)}}.mth-trend .mth-o{stroke:currentColor;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}.mth-trend .mth-l{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}.mth-trend .mth-a{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.mth-trend .mth-ac{stroke:var(--mth-ac);stroke-width:2.4}.mth-trend .mth-acf{fill:var(--mth-ac)}.mth-trend .mth-dd{stroke-dasharray:4 4}.mth-trend .mth-mu{stroke:var(--muted,#7a8a80)}.mth-trend .mth-card{fill:var(--surface,#f8faf6);stroke:currentColor;stroke-opacity:.45;stroke-width:1.3}.mth-trend .mth-nb{fill:currentColor;fill-opacity:.06;stroke:currentColor;stroke-opacity:.35;stroke-width:1.2}.mth-trend text{fill:currentColor;font-size:14.5px}.mth-trend .mth-m{fill:var(--muted,#7a8a80)}.mth-trend .mth-b{font-weight:700}.mth-trend .mth-s{font-size:13.5px}.mth-trend .mth-big{font-size:22px;font-weight:900}</style><defs><marker id="mth-trend-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker><marker id="mth-trend-hc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mth-acf"/></marker><marker id="mth-trend-hm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--muted,#7a8a80)"/></marker></defs><text class="mth-b mth-s" x="4" y="16">재료와 비중</text><text class="mth-s mth-m" x="396" y="16" text-anchor="end">합 100</text><rect class="mth-card" x="4" y="26" width="392" height="28" rx="8"/><g transform="translate(22 40)"><path class="mth-o" style="fill:#fbf6ea;stroke-width:1.6" d="M-9,-8H9Q11,-8 11,-6V4Q11,6 9,6H-2L-7,10V6H-9Q-11,6 -11,4V-6Q-11,-8 -9,-8Z"/><path d="M-6,-3H6M-6,1H3" stroke="#2a1806" stroke-width="1.4" stroke-linecap="round"/></g><rect x="40" y="34" width="12" height="12" rx="3" style="fill:#c9822b;stroke:currentColor;stroke-width:1"/><text x="60" y="45">데일리샷 리뷰 수</text><text class="mth-b" x="386" y="46" text-anchor="end" style="font-size:16px">70</text><rect class="mth-card" x="4" y="58" width="392" height="28" rx="8"/><g transform="translate(22 72)"><path class="mth-o" style="fill:#fbf6ea;stroke-width:1.6" d="M0,-7Q-5,-10 -10,-8V8Q-5,6 0,9Q5,6 10,8V-8Q5,-10 0,-7ZM0,-7V9"/><path d="M-7,-3H-3M-7,1H-3M3,-3H7M3,1H7" stroke="#2a1806" stroke-width="1.2" stroke-linecap="round"/></g><rect x="40" y="66" width="12" height="12" rx="3" style="fill:#e0a95a;stroke:currentColor;stroke-width:1"/><text x="60" y="77">위키백과 조회수</text><text class="mth-b" x="386" y="78" text-anchor="end" style="font-size:16px">18</text><rect class="mth-card" x="4" y="90" width="392" height="28" rx="8"/><g transform="translate(22 104)"><rect class="mth-o" style="fill:#fbf6ea;stroke-width:1.6" x="-10" y="-9" width="20" height="18" rx="2"/><rect x="-7" y="-6" width="6" height="5" fill="#c9822b"/><path d="M1,-5H7M1,-2H7M-7,2H7M-7,5H7" stroke="#2a1806" stroke-width="1.2" stroke-linecap="round"/></g><rect x="40" y="98" width="12" height="12" rx="3" style="fill:#efcd8f;stroke:currentColor;stroke-width:1"/><text x="60" y="109">해외 출처 등장 횟수</text><text class="mth-b" x="386" y="110" text-anchor="end" style="font-size:16px">12</text><rect x="4" y="138" width="274.4" height="22" style="fill:#c9822b"/><text class="mth-b mth-s" x="141.2" y="154" text-anchor="middle" style="fill:#2a1806">70</text><rect x="278.4" y="138" width="70.6" height="22" style="fill:#e0a95a"/><text class="mth-b mth-s" x="313.7" y="154" text-anchor="middle" style="fill:#2a1806">18</text><rect x="349" y="138" width="47" height="22" style="fill:#efcd8f"/><text class="mth-b mth-s" x="372.5" y="154" text-anchor="middle" style="fill:#2a1806">12</text><rect x="4" y="138" width="392" height="22" rx="4" style="fill:none;stroke:currentColor;stroke-width:1.6"/><path class="mth-l" d="M6,166v5H276.4v-5"/><text class="mth-s" x="141.2" y="188" text-anchor="middle">국내 점수</text><path class="mth-l" d="M280.4,166v5H394v-5"/><text class="mth-s" x="337.2" y="188" text-anchor="middle">해외 점수</text><path class="mth-a" d="M130,202V222" marker-end="url(#mth-trend-h)"/><text class="mth-s mth-m" x="140" y="217">재료별 부분 점수(0~100)의 가중 평균</text><path d="M60,306A70,70 0 0 1 200,306" style="fill:none;stroke:currentColor;stroke-opacity:.15;stroke-width:16"/><path d="M60,306A70,70 0 0 1 155.8,240.9" style="fill:none;stroke:#c9822b;stroke-width:16"/><path class="mth-l" d="M50,306L45,306"/><path class="mth-l" d="M73.4,249.4L69.9,245.9"/><path class="mth-l" d="M130,226L130,221"/><path class="mth-l" d="M186.6,249.4L190.1,245.9"/><path class="mth-l" d="M210,306L215,306"/><path class="mth-o" style="fill:none;stroke-width:3" d="M130,306L149.1,257.7"/><circle class="mth-o" style="fill:var(--surface,#f8faf6)" cx="130" cy="306" r="5"/><text class="mth-s mth-m" x="60" y="324" text-anchor="middle">0</text><text class="mth-s mth-m" x="200" y="324" text-anchor="middle">100</text><text class="mth-b" x="130" y="328" text-anchor="middle">트렌드지수</text><text class="mth-s mth-m" x="130" y="346" text-anchor="middle">누적 인지도</text><rect class="mth-nb" x="254" y="232" width="144" height="120" rx="10" style="stroke-dasharray:4 3"/><rect x="270" y="246" width="18" height="18" rx="3" style="fill:#5a1a12"/><text class="mth-b" x="279" y="260" text-anchor="middle" style="fill:#fff7ea;font-size:12px">S</text><rect x="290" y="246" width="18" height="18" rx="3" style="fill:#8a3414"/><text class="mth-b" x="299" y="260" text-anchor="middle" style="fill:#fff7ea;font-size:12px">A</text><rect x="310" y="246" width="18" height="18" rx="3" style="fill:#b85c16"/><text class="mth-b" x="319" y="260" text-anchor="middle" style="fill:#fff7ea;font-size:12px">B</text><rect x="330" y="246" width="18" height="18" rx="3" style="fill:#d98a1f"/><text class="mth-b" x="339" y="260" text-anchor="middle" style="fill:#231603;font-size:12px">C</text><rect x="350" y="246" width="18" height="18" rx="3" style="fill:#e9b949"/><text class="mth-b" x="359" y="260" text-anchor="middle" style="fill:#231603;font-size:12px">D</text><rect x="370" y="246" width="18" height="18" rx="3" style="fill:#f0dc8c"/><text class="mth-b" x="379" y="260" text-anchor="middle" style="fill:#231603;font-size:12px">E</text><path class="mth-a mth-mu mth-dd" d="M180,256Q232,264 250,280"/><g transform="translate(242 272)"><circle r="9" style="fill:var(--surface,#f8faf6);stroke:#b3261e;stroke-width:2"/><path d="M-4,-4L4,4M4,-4L-4,4" stroke="#b3261e" stroke-width="2.4" stroke-linecap="round"/></g><text class="mth-s" x="326" y="290" text-anchor="middle">티어·종합 점수·</text><text class="mth-s" x="326" y="308" text-anchor="middle">확신도 계산에는</text><text class="mth-b mth-s" x="326" y="326" text-anchor="middle">넣지 않음</text></svg>
