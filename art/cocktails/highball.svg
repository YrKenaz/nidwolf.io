<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" class="cka cka-highball" role="img" aria-labelledby="cka-highball-t"><title id="cka-highball-t">하이볼: 하이볼 잔, 각얼음. 아래부터 위스키 45ml, 탄산수 잔을 채울 만큼(약 135ml, 위스키의 3배) 층. 넣는 순서: 1. 위스키, 2. 탄산수.</title><style>.cka-highball{color:var(--ink,#14201a);font-family:inherit}@media(prefers-color-scheme:dark){.cka-highball{color:var(--ink,#e8eee9)}}.cka-highball .cka-o{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}.cka-highball .cka-w{fill:currentColor;fill-opacity:.14}.cka-highball .cka-g{fill:currentColor;fill-opacity:.05}.cka-highball .cka-l{stroke:currentColor;stroke-opacity:.4;stroke-width:1}.cka-highball .cka-e{stroke:currentColor;stroke-width:1.6;stroke-dasharray:4 3}.cka-highball .cka-i rect{fill:#fff;fill-opacity:.16;stroke:currentColor;stroke-opacity:.5;stroke-width:1.4}.cka-highball .cka-u circle{fill:none;stroke:#fff;stroke-opacity:.85;stroke-width:1.2}.cka-highball .cka-h{fill:none;stroke:#fff;stroke-opacity:.6;stroke-width:4;stroke-linecap:round}.cka-highball .cka-b{fill:none;stroke:currentColor;stroke-opacity:.45;stroke-width:1.5}.cka-highball .cka-m{fill:none;stroke:var(--muted,#7a8a80);stroke-width:1.2}.cka-highball .cka-t{fill:currentColor;font-size:14.5px}.cka-highball .cka-a{font-weight:700}.cka-highball .cka-q{fill:var(--muted,#7a8a80);font-size:12px}.cka-highball .cka-n{font-size:12px;font-weight:700;text-anchor:middle}.cka-highball .cka-c{fill:var(--muted,#7a8a80);font-size:12.5px;text-anchor:middle}.cka-highball .cka-p{fill:none;stroke:var(--muted,#7a8a80);stroke-width:1;stroke-dasharray:3 2}</style><defs><clipPath id="cka-highball-c"><path d="M50,255 47,55 113,55 110,255Z"/></clipPath></defs><g class="cka-glass cka-glass-back"><path class="cka-w" d="M43,55 46,255 46,262 47.5,266.5 52,268 108,268 112.5,266.5 114,262 114,255 117,55 113,55 110,255 50,255 47,55Z"/><path class="cka-g" d="M50,255 47,55 113,55 110,255Z"/></g><g class="cka-step cka-layer" data-i="