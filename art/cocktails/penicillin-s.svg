<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 160 240" class="cka cka-penicillin" role="img" aria-labelledby="cka-penicillin-s-t"><title id="cka-penicillin-s-t">페니실린: 록스 잔, 각얼음. 아래부터 블렌디드 스카치 위스키 60ml, 레몬 주스 22.5ml, 꿀 시럽 22.5ml, 아일라 싱글몰트(라가불린 16년) 7.5ml 층. 함께 넣는 재료: 생강 슬라이스 2~3조각. 넣는 순서: 1. 생강 슬라이스, 2. 블렌디드 스카치 위스키, 3. 레몬 주스, 4. 꿀 시럽, 5. 아일라 싱글몰트(라가불린 16년).</title><style>.cka-penicillin{color:var(--ink,#14201a);font-family:inherit}@media(prefers-color-scheme:dark){.cka-penicillin{color:var(--ink,#e8eee9)}}.cka-penicillin .cka-o{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}.cka-penicillin .cka-w{fill:currentColor;fill-opacity:.14}.cka-penicillin .cka-g{fill:currentColor;fill-opacity:.05}.cka-penicillin .cka-l{stroke:currentColor;stroke-opacity:.4;stroke-width:1}.cka-penicillin .cka-e{stroke:currentColor;stroke-width:1.6;stroke-dasharray:4 3}.cka-penicillin .cka-i rect{fill:#fff;fill-opacity:.16;stroke:currentColor;stroke-opacity:.5;stroke-width:1.4}.cka-penicillin .cka-u circle{fill:none;stroke:#fff;stroke-opacity:.85;stroke-width:1.2}.cka-penicillin .cka-h{fill:none;stroke:#fff;stroke-opacity:.6;stroke-width:4;stroke-linecap:round}.cka-penicillin .cka-b{fill:none;stroke:currentColor;stroke-opacity:.45;stroke-width:1.5}.cka-penicillin .cka-m{fill:none;stroke:var(--muted,#7a8a80);stroke-width:1.2}</style><path class="cka-w" d="M15.5,112 22.5,252 22.5,262 24,266.5 28.5,268 131.5,268 136,266.5 137.5,262 137.5,252 144.5,112 140,112 133,252 27,252 20,112Z"/><path class="cka-g" d="M27,252 20,112 140,112 133,252Z"/><polygon class="cka-l" fill="#d49a3a" points="27,252 23.9,189.4 136.1,189.4 133,252"/><polygon class="cka-l" fill="#f4e27a" points="23.9,189.4 22.8,167.6 137.2,167.6 136.1,189.4"/><polygon class="cka-l" fill="#e8b04a" points="22.8,167.6 21.7,146.7 138.3,146.7 137.2,167.6"/><polygon class="cka-l" fill="#a8742a" points="21.7,146.7 21.4,139.8 138.6,139.8 138.3,146.7"/><path class="cka-h" style="stroke-width:2;stroke-opacity:.5" d="M27.4,142.8H101"/><clipPath id="cka-penicillin-s-c"><path d="M27,252 20,112 140,112 133,252Z"/></clipPath><g class="cka-i" clip-path="url(#cka-penicillin-s-c)"><rect x="44.6" y="209.4" width="36" height="36" rx="5" transform="rotate(-8 62.6 227.4)"/><rect x="79.8" y="179.9" width="36" height="36" rx="5" transform="rotate(8 97.8 197.9)"/><rect x="43.7" y="150.4" width="36" height="36" rx="5" transform="rotate(-8 61.7 168.4)"/><rect x="80.8" y="120.8" width="36" height="36" rx="5" transform="rotate(8 98.8 138.8)"/></g><path class="cka-h" d="M33.2,235.2 29.7,165.2"/><path class="cka-h" d="M29.1,154 28.4,140"/><path class="cka-o" d="M15.5,112 22.5,252 22.5,262 24,266.5 28.5,268 131.5,268 136,266.5 137.5,262 137.5,252 144.5,112 140,112 133,252 27,252 20,112Z"/></svg>
