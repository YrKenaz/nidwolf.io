<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 160 240" class="cka cka-manhattan" role="img" aria-labelledby="cka-manhattan-s-t"><title id="cka-manhattan-s-t">맨해튼: 마티니 잔, 얼음 없음. 아래부터 라이 위스키 50ml, 스위트 베르무트 20ml 층. 함께 넣는 재료: 앙고스투라 비터스 1대시. 넣는 순서: 1. 라이 위스키, 2. 스위트 베르무트, 3. 앙고스투라 비터스.</title><style>.cka-manhattan{color:var(--ink,#14201a);font-family:inherit}@media(prefers-color-scheme:dark){.cka-manhattan{color:var(--ink,#e8eee9)}}.cka-manhattan .cka-o{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}.cka-manhattan .cka-w{fill:currentColor;fill-opacity:.14}.cka-manhattan .cka-g{fill:currentColor;fill-opacity:.05}.cka-manhattan .cka-l{stroke:currentColor;stroke-opacity:.4;stroke-width:1}.cka-manhattan .cka-e{stroke:currentColor;stroke-width:1.6;stroke-dasharray:4 3}.cka-manhattan .cka-i rect{fill:#fff;fill-opacity:.16;stroke:currentColor;stroke-opacity:.5;stroke-width:1.4}.cka-manhattan .cka-u circle{fill:none;stroke:#fff;stroke-opacity:.85;stroke-width:1.2}.cka-manhattan .cka-h{fill:none;stroke:#fff;stroke-opacity:.6;stroke-width:4;stroke-linecap:round}.cka-manhattan .cka-b{fill:none;stroke:currentColor;stroke-opacity:.45;stroke-width:1.5}.cka-manhattan .cka-m{fill:none;stroke:var(--muted,#7a8a80);stroke-width:1.2}</style><defs><clipPath id="cka-manhattan-s-c"><path d="M78,183 16,83 144,83 82,183Z"/></clipPath></defs><g class="cka-glass cka-glass-back"><path class="cka-w" d="M12.5,83 74.5,183 74,188.5 76,195.5 76,259 70,263 40,265.5 42,268 118,268 120,265.5 90,263 84,259 84,195.5 86,188.5 85.5,183 147.5,83 144,83 82,183 78,183 16,83Z"/><path class="cka-g" d="M78,183 16,83 144,83 82,183Z"/></g><g class="cka-step cka-layer" data-i="0" data-y0="183" data-y1="99.2" clip-path="url(#cka-manhattan-s-c)"><rect class="cka-l cka-fill" fill="#b5702e" x="14" y="99.2" width="132" height="83.8"/></g><g class="cka-step cka-layer" data-i="1" data-y0="99.2" data-y1="88.8" clip-path="url(#cka-manhattan-s-c)"><rect class="cka-l cka-fill" fi