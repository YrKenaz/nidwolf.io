<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 160 240" class="cka cka-paper-plane" role="img" aria-labelledby="cka-paper-plane-s-t"><title id="cka-paper-plane-s-t">페이퍼 플레인: 마티니 잔, 얼음 없음. 아래부터 버번 위스키 30ml, 아마로 노니노 30ml, 아페롤 30ml, 레몬 주스 30ml 층. 넣는 순서: 1. 버번 위스키, 2. 아마로 노니노, 3. 아페롤, 4. 레몬 주스.</title><style>.cka-paper-plane{color:var(--ink,#14201a);font-family:inherit}@media(prefers-color-scheme:dark){.cka-paper-plane{color:var(--ink,#e8eee9)}}.cka-paper-plane .cka-o{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}.cka-paper-plane .cka-w{fill:currentColor;fill-opacity:.14}.cka-paper-plane .cka-g{fill:currentColor;fill-opacity:.05}.cka-paper-plane .cka-l{stroke:currentColor;stroke-opacity:.4;stroke-width:1}.cka-paper-plane .cka-e{stroke:currentColor;stroke-width:1.6;stroke-dasharray:4 3}.cka-paper-plane .cka-i rect{fill:#fff;fill-opacity:.16;stroke:currentColor;stroke-opacity:.5;stroke-width:1.4}.cka-paper-plane .cka-u circle{fill:none;stroke:#fff;stroke-opacity:.85;stroke-width:1.2}.cka-paper-plane .cka-h{fill:none;stroke:#fff;stroke-opacity:.6;stroke-width:4;stroke-linecap:round}.cka-paper-plane .cka-b{fill:none;stroke:currentColor;stroke-opacity:.45;stroke-width:1.5}.cka-paper-plane .cka-m{fill:none;stroke:var(--muted,#7a8a80);stroke-width:1.2}</style><path class="cka-w" d="M12.5,83 74.5,183 74,188.5 76,195.5 76,259 70,263 40,265.5 42,268 118,268 120,265.5 90,263 84,259 84,195.5 86,188.5 85.5,183 147.5,83 144,83 82,183 78,183 16,83Z"/><path class="cka-g" d="M78,183 16,83 144,83 82,183Z"/><polygon class="cka-l" fill="#b8652a" points="78,183 42,124.9 118,124.9 82,183"/><polygon class="cka-l" fill="#a0522d" points="42,124.9 32.1,108.9 127.9,108.9 118,124.9"/><polygon class="cka-l" fill="#f2662b" points="32.1,108.9 25.1,97.7 134.9,97.7 127.9,108.9"/><polygon class="cka-l" fill="#f4e27a" points="25.1,97.7 19.6,88.8 140.4,88.8 134.9,97.7"/><path class="cka-e" d="M42,124.9H118"/><path class="cka-h" style="stroke-width:2;strok