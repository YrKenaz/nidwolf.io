<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" class="cka cka-penicillin" role="img" aria-labelledby="cka-penicillin-t"><title id="cka-penicillin-t">페니실린: 록스 잔, 각얼음. 아래부터 블렌디드 스카치 위스키 60ml, 레몬 주스 22.5ml, 꿀 시럽 22.5ml, 아일라 싱글몰트(라가불린 16년) 7.5ml 층. 함께 넣는 재료: 생강 슬라이스 2~3조각. 넣는 순서: 1. 생강 슬라이스, 2. 블렌디드 스카치 위스키, 3. 레몬 주스, 4. 꿀 시럽, 5. 아일라 싱글몰트(라가불린 16년).</title><style>.cka-penicillin{color:var(--ink,#14201a);font-family:inherit}@media(prefers-color-scheme:dark){.cka-penicillin{color:var(--ink,#e8eee9)}}.cka-penicillin .cka-o{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}.cka-penicillin .cka-w{fill:currentColor;fill-opacity:.14}.cka-penicillin .cka-g{fill:currentColor;fill-opacity:.05}.cka-penicillin .cka-l{stroke:currentColor;stroke-opacity:.4;stroke-width:1}.cka-penicillin .cka-e{stroke:currentColor;stroke-width:1.6;stroke-dasharray:4 3}.cka-penicillin .cka-i rect{fill:#fff;fill-opacity:.16;stroke:currentColor;stroke-opacity:.5;stroke-width:1.4}.cka-penicillin .cka-u circle{fill:none;stroke:#fff;stroke-opacity:.85;stroke-width:1.2}.cka-penicillin .cka-h{fill:none;stroke:#fff;stroke-opacity:.6;stroke-width:4;stroke-linecap:round}.cka-penicillin .cka-b{fill:none;stroke:currentColor;stroke-opacity:.45;stroke-width:1.5}.cka-penicillin .cka-m{fill:none;stroke:var(--muted,#7a8a80);stroke-width:1.2}.cka-penicillin .cka-t{fill:currentColor;font-size:14.5px}.cka-penicillin .cka-a{font-weight:700}.cka-penicillin .cka-q{fill:var(--muted,#7a8a80);font-size:12px}.cka-penicillin .cka-n{font-size:12px;font-weight:700;text-anchor:middle}.cka-penicillin .cka-c{fill:var(--muted,#7a8a80);font-size:12.5px;text-anchor:middle}.cka-penicillin .cka-p{fill:none;stroke:var(--muted,#7a8a80);stroke-width:1;stroke-dasharray:3 2}</style><defs><clipPath id="cka-penicillin-c"><path d="M27,252 20,112 140,112 133,252Z"/></clipPath></defs><g class="cka-glass cka-glass-back"><path class="cka-w" d="M15.5,112 22.5,252 22.5,262 24,266.5 28.5,268 131.5,268 136,266.5 137.5,262 137.5,252 144.5,112 140,112 133,252 27,252 20,112Z"/><path class="cka-g" d="M27,252 20,112 140,112 133,252Z"/></g><g class="cka-step cka-layer" data-i="1" data-y0="252" data-y1="189.4" clip-path="url(#cka-penicillin-c)"><rect class="cka-l cka-fill" fill="#d49a3a" x="18" y="189.4" width="124" height="62.6"/></g><g class="cka-step cka-layer" data-i="2" data-y0="189.4" data-y1="167.6" clip-path="url(#cka-penicillin-c)"><rect class="cka-l cka-fill" fill="#f4e27a" x="18" y="167.6" width="124" height="21.8"/></g><g class="cka-step cka-layer" data-i="3" data-y0="167.6" data-y1="146.7" clip-path="url(#cka-penicillin-c)"><rect class="cka-l cka-fill" fill="#e8b04a" x="18" y="146.7" width="124" height="21"/></g><g class="cka-step cka-layer" data-i="4" data-y0="146.7" data-y1="139.8" clip-path="url(#cka-penicillin-c)"><rect class="cka-l cka-fill" fill="#a8742a" x="18" y="139.8" width="124" height="6.8"/><path class="cka-h" style="stroke-width:2;stroke-opacity:.5" d="M27.4,142.8H101"/></g><g class="cka-i cka-ice" clip-path="url(#cka-penicillin-c)"><rect x="44.6" y="209.4" width="36" height="36" rx="5" transform="rotate(-8 62.6 227.4)"/><rect x="79.8" y="179.9" width="36" height="36" rx="5" transform="rotate(8 97.8 197.9)"/><rect x="43.7" y="150.4" width="36" height="36" rx="5" transform="rotate(-8 61.7 168.4)"/><rect x="80.8" y="120.8" width="36" height="36" rx="5" transform="rotate(8 98.8 138.8)"/></g><g class="cka-glass cka-glass-front"><path class="cka-h" d="M33.2,235.2 29.7,165.2"/><path class="cka-h" d="M29.1,154 28.4,140"/><path class="cka-o" d="M15.5,112 22.5,252 22.5,262 24,266.5 28.5,268 131.5,268 136,266.5 137.5,262 137.5,252 144.5,112 140,112 133,252 27,252 20,112Z"/></g><g class="cka-garnish"><ellipse class="cka-o" style="fill:#e6cf8f;stroke-width:1.8" cx="117.2" cy="109" rx="9" ry="6"/></g><g class="cka-step cka-chip" data-i="0"><rect class="cka-p" x="177" y="223" width="123.9" height="40" rx="9"/><ellipse class="cka-o" style="fill:#e6cf8f;stro