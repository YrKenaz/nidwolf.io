<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 160 240" class="cka cka-old-fashioned" role="img" aria-labelledby="cka-old-fashioned-s-t"><title id="cka-old-fashioned-s-t">올드 패션드: 록스 잔, 큰 얼음. 아래부터 버번 또는 라이 위스키 45ml 층. 함께 넣는 재료: 각설탕 1개, 앙고스투라 비터스 몇 대시, 물 몇 대시. 넣는 순서: 1. 각설탕, 2. 앙고스투라 비터스, 3. 물, 4. 버번 또는 라이 위스키.</title><style>.cka-old-fashioned{color:var(--ink,#14201a);font-family:inherit}@media(prefers-color-scheme:dark){.cka-old-fashioned{color:var(--ink,#e8eee9)}}.cka-old-fashioned .cka-o{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}.cka-old-fashioned .cka-w{fill:currentColor;fill-opacity:.14}.cka-old-fashioned .cka-g{fill:currentColor;fill-opacity:.05}.cka-old-fashioned .cka-l{stroke:currentColor;stroke-opacity:.4;stroke-width:1}.cka-old-fashioned .cka-e{stroke:currentColor;stroke-width:1.6;stroke-dasharray:4 3}.cka-old-fashioned .cka-i rect{fill:#fff;fill-opacity:.16;stroke:currentColor;stroke-opacity:.5;stroke-width:1.4}.cka-old-fashioned .cka-u circle{fill:none;stroke:#fff;stroke-opacity:.85;stroke-width:1.2}.cka-old-fashioned .cka-h{fill:none;stroke:#fff;stroke-opacity:.6;stroke-width:4;stroke-linecap:round}.cka-old-fashioned .cka-b{fill:none;stroke:currentColor;stroke-opacity:.45;stroke-width:1.5}.cka-old-fashioned .cka-m{fill:none;stroke:var(--muted,#7a8a80);stroke-width:1.2}</style><defs><clipPath id="cka-old-fashioned-s-c"><path d="M27,252 20,112 140,112 133,252Z"/></clipPath></defs><g class="cka-glass cka-glass-back"><path class="cka-w" d="M15.5,112 22.5,252 22.5,262 24,266.5 28.5,268 131.5,268 136,266.5 137.5,262 137.5,252 144.5,112 140,112 133,252 27,252 20,112Z"/><path class="cka-g" d="M27,252 20,112 140,112 133,252Z"/></g><g class="cka-step cka-layer" data-i="3" data-y0="252" data-y1="163.9" clip-path="url(#cka-old-fashioned-s-c)"><rect class="cka-l cka-fill" fill="#b8652a" x="18" y="163.9" width="124" height="88.1"/><path class="cka-h" style="stroke-width:2;stroke-opacity:.5" d="M28.6,166.9H100.6"/><