<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 160 240" class="cka cka-irish-coffee" role="img" aria-labelledby="cka-irish-coffee-s-t"><title id="cka-irish-coffee-s-t">아이리시 커피: 머그, 얼음 없음. 아래부터 아이리시 위스키 50ml, 뜨거운 커피 120ml, 차가운 생크림 50ml 층. 함께 넣는 재료: 설탕 1티스푼. 넣는 순서: 1. 설탕, 2. 아이리시 위스키, 3. 뜨거운 커피, 4. 차가운 생크림.</title><style>.cka-irish-coffee{color:var(--ink,#14201a);font-family:inherit}@media(prefers-color-scheme:dark){.cka-irish-coffee{color:var(--ink,#e8eee9)}}.cka-irish-coffee .cka-o{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}.cka-irish-coffee .cka-w{fill:currentColor;fill-opacity:.14}.cka-irish-coffee .cka-g{fill:currentColor;fill-opacity:.05}.cka-irish-coffee .cka-l{stroke:currentColor;stroke-opacity:.4;stroke-width:1}.cka-irish-coffee .cka-e{stroke:currentColor;stroke-width:1.6;stroke-dasharray:4 3}.cka-irish-coffee .cka-i rect{fill:#fff;fill-opacity:.16;stroke:currentColor;stroke-opacity:.5;stroke-width:1.4}.cka-irish-coffee .cka-u circle{fill:none;stroke:#fff;stroke-opacity:.85;stroke-width:1.2}.cka-irish-coffee .cka-h{fill:none;stroke:#fff;stroke-opacity:.6;stroke-width:4;stroke-linecap:round}.cka-irish-coffee .cka-b{fill:none;stroke:currentColor;stroke-opacity:.45;stroke-width:1.5}.cka-irish-coffee .cka-m{fill:none;stroke:var(--muted,#7a8a80);stroke-width:1.2}</style><defs><clipPath id="cka-irish-coffee-s-c"><path d="M36,254 32,94 128,94 124,254Z"/></clipPath></defs><g class="cka-glass cka-glass-back"><path class="cka-o" d="M32,122.8C-2.5,118.8 -2.5,229.2 32,225.2"/><path class="cka-o" d="M32,134.8C11.5,132.8 11.5,215.2 32,213.2"/><path class="cka-w" d="M27.5,94 31.5,254 31.5,262 33,266.5 37.5,268 122.5,268 127,266.5 128.5,262 128.5,254 132.5,94 128,94 124,254 36,254 32,94Z"/><path class="cka-g" d="M36,254 32,94 128,94 124,254Z"/></g><g class="cka-step cka-layer" data-i="1" data-y0="254" data-y1="225.3" clip-path="url(#cka-irish-coffee-s-c)"><rect class="cka-l cka-fill" fill="#d8a24a" x="30" y="225.3" width=