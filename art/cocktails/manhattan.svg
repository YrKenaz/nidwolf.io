<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" class="cka cka-manhattan" role="img" aria-labelledby="cka-manhattan-t"><title id="cka-manhattan-t">맨해튼: 마티니 잔, 얼음 없음. 아래부터 라이 위스키 50ml, 스위트 베르무트 20ml 층. 함께 넣는 재료: 앙고스투라 비터스 1대시. 넣는 순서: 1. 라이 위스키, 2. 스위트 베르무트, 3. 앙고스투라 비터스.</title><style>.cka-manhattan{color:var(--ink,#14201a);font-family:inherit}@media(prefers-color-scheme:dark){.cka-manhattan{color:var(--ink,#e8eee9)}}.cka-manhattan .cka-o{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}.cka-manhattan .cka-w{fill:currentColor;fill-opacity:.14}.cka-manhattan .cka-g{fill:currentColor;fill-opacity:.05}.cka-manhattan .cka-l{stroke:currentColor;stroke-opacity:.4;stroke-width:1}.cka-manhattan .cka-e{stroke:currentColor;stroke-width:1.6;stroke-dasharray:4 3}.cka-manhattan .cka-i rect{fill:#fff;fill-opacity:.16;stroke:currentColor;stroke-opacity:.5;stroke-width:1.4}.cka-manhattan .cka-u circle{fill:none;stroke:#fff;stroke-opacity:.85;stroke-width:1.2}.cka-manhattan .cka-h{fill:none;stroke:#fff;stroke-opacity:.6;stroke-width:4;stroke-linecap:round}.cka-manhattan .cka-b{fill:none;stroke:currentColor;stroke-opacity:.45;stroke-width:1.5}.cka-manhattan .cka-m{fill:none;stroke:var(--muted,#7a8a80);stroke-width:1.2}.cka-manhattan .cka-t{fill:currentColor;font-size:14.5px}.cka-manhattan .cka-a{font-weight:700}.cka-manhattan .cka-q{fill:var(--muted,#7a8a80);font-size:12px}.cka-manhattan .cka-n{font-size:12px;font-weight:700;text-anchor:middle}.cka-manhattan .cka-c{fill:var(--muted,#7a8a80);font-size:12.5px;text-anchor:middle}.cka-manhattan .cka-p{fill:none;stroke:var(--muted,#7a8a80);stroke-width:1;stroke-dasharray:3 2}</style><path class="cka-w" d="M12.5,83 74.5,183 74,188.5 76,195.5 76,259 70,263 40,265.5 42,268 118,268 120,265.5 90,263 84,259 84,195.5 86,188.5 85.5,183 147.5,83 144,83 82,183 78,183 16,83Z"/><path class="cka-g" d="M78,183 16,83 144,83 82,183Z"/><polygon class="cka-l" fill="#b5702e" points="78,183 26,99.2 134,99.2 82,183"/><polygon class="cka-l" fill="#7b1e2b" points="26,99.2 19.6,88.8 140.4,88.8 134,99.2"/><path class="cka-h" style="stroke-width:2;stroke-opacity:.5" d="M25.6,91.8H101.8"/><path class="cka-h" d="M80.6,171 49.6,121"/><path class="cka-h" d="M44.6,113 38.4,103"/><path class="cka-o" d="M12.5,83 74.5,183 74,188.5 76,195.5 76,259 70,263 40,265.5 42,268 118,268 120,265.5 90,263 84,259 84,195.5 86,188.5 85.5,183 147.5,83 144,83 82,183 78,183 16,83Z"/><path class="cka-o" style="stroke-width:1.8" d="M119.7,75q4,-12 12,-16"/><circle class="cka-o" style="fill:#b3122e;stroke-width:2" cx="119.7" cy="79" r="6.5"/><circle cx="117.7" cy="76.5" r="1.6" fill="#fff" fill-opacity=".7"/><path class="cka-m" d="M85.6,141.1H116.5L156,141.1"/><circle cx="85.6" cy="141.1" r="2.6" fill="currentColor"/><circle class="cka-o" style="fill:#b5702e;stroke-width:1.5" cx="169" cy="141.1" r="9.5"/><text class="cka-n" x="169" y="145.3" fill="#fff">1</text><text class="cka-t" x="184" y="146.1">라이 위스키 <tspan class="cka-a">50ml</tspan> <tspan class="cka-q">· 71%</tspan></text><path class="cka-m" d="M104,94H145.7L156,107.4"/><circle cx="104" cy="94" r="2.6" fill="currentColor"/><circle class="cka-o" style="fill:#7b1e2b;stroke-width:1.5" cx="169" cy="107.4" r="9.5"/><text class="cka-n" x="169" y="111.6" fill="#fff">2</text><text class="cka-t" x="184" y="112.4">스위트 베르무트 <tspan class="cka-a">20ml</tspan></text><rect class="cka-p" x="177" y="51.4" width="151.7" height="40" rx="9"/><path class="cka-o" style="fill:#7a2e1d;stroke-width:1.6" d="M192,55.4c4,5 6,8 6,10a6,6 0 0 1 -12,0c0,-2 2,-5 6,-10z"/><circle class="cka-o" style="fill:#7a2e1d;stroke-width:1.5" cx="169" cy="62.4" r="9.5"/><text class="cka-n" x="169" y="66.6" fill="#fff">3</text><text class="cka-t" x="202" y="67.4">앙고스투라 비터스</text><text class="cka-t" x="202" y="85.4"><tspan class="cka-a">1대시</tspan></text><text class="cka-c" x="80" y="290">마티니 잔 · 얼음 없음</text></svg>
