<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 160 240" class="cka cka-sazerac" role="img" aria-labelledby="cka-sazerac-s-t"><title id="cka-sazerac-s-t">사제락: 록스 잔, 얼음 없음. 아래부터 라이 위스키 45ml, 진한 설탕 시럽(2:1) 7.5ml 층. 함께 넣는 재료: 압생트(잔 헹굼용) 4대시, 페이쇼 비터스 3대시. 넣는 순서: 1. 압생트(잔 헹굼용), 2. 라이 위스키, 3. 진한 설탕 시럽(2:1), 4. 페이쇼 비터스.</title><style>.cka-sazerac{color:var(--ink,#14201a);font-family:inherit}@media(prefers-color-scheme:dark){.cka-sazerac{color:var(--ink,#e8eee9)}}.cka-sazerac .cka-o{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}.cka-sazerac .cka-w{fill:currentColor;fill-opacity:.14}.cka-sazerac .cka-g{fill:currentColor;fill-opacity:.05}.cka-sazerac .cka-l{stroke:currentColor;stroke-opacity:.4;stroke-width:1}.cka-sazerac .cka-e{stroke:currentColor;stroke-width:1.6;stroke-dasharray:4 3}.cka-sazerac .cka-i rect{fill:#fff;fill-opacity:.16;stroke:currentColor;stroke-opacity:.5;stroke-width:1.4}.cka-sazerac .cka-u circle{fill:none;stroke:#fff;stroke-opacity:.85;stroke-width:1.2}.cka-sazerac .cka-h{fill:none;stroke:#fff;stroke-opacity:.6;stroke-width:4;stroke-linecap:round}.cka-sazerac .cka-b{fill:none;stroke:currentColor;stroke-opacity:.45;stroke-width:1.5}.cka-sazerac .cka-m{fill:none;stroke:var(--muted,#7a8a80);stroke-width:1.2}</style><defs><clipPath id="cka-sazerac-s-c"><path d="M27,252 20,112 140,112 133,252Z"/></clipPath></defs><g class="cka-glass cka-glass-back"><path class="cka-w" d="M15.5,112 22.5,252 22.5,262 24,266.5 28.5,268 131.5,268 136,266.5 137.5,262 137.5,252 144.5,112 140,112 133,252 27,252 20,112Z"/><path class="cka-g" d="M27,252 20,112 140,112 133,252Z"/></g><g class="cka-step cka-layer" data-i="1" data-y0="252" data-y1="187.7" clip-path="url(#cka-sazerac-s-c)"><rect class="cka-l cka-fill" fill="#b5702e" x="18" y="187.7" width="124" height="64.3"/></g><g class="cka-step cka-layer" data-i="2" data-y0="187.7" data-y1="177.7" clip-path="url(#cka-sazerac-s-c)"><rect class="cka-l cka-fill" fill="#f7f3e8" x="18" y="1